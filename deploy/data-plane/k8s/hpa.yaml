apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureops-data-plane-hpa
  namespace: secureops
  labels:
    app: secureops
    plane: data
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureops-data-plane
  minReplicas: 2
  maxReplicas: 10
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 120
      policies:
        - type: Pods
          value: 2
          periodSeconds: 120
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Percent
          value: 25
          periodSeconds: 120
