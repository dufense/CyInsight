apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secureops-data-plane-storage
  namespace: secureops
  labels:
    app: secureops
    plane: data
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 100Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: secureops-data-plane-parquet
  namespace: secureops
  labels:
    app: secureops
    plane: data
    tier: cold
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: standard
  resources:
    requests:
      storage: 500Gi
