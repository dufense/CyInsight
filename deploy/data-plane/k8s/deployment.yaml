apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-data-plane
  namespace: secureops
  labels:
    app: secureops
    plane: data
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureops
      plane: data
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: secureops
        plane: data
    spec:
      serviceAccountName: secureops-data-plane
      containers:
        - name: data-plane
          image: secureops/data-plane:latest
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: PLANE
              value: "data"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: timescaledb-url
            - name: OPENSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: secureops-data-plane-config
                  key: opensearch-url
            - name: OBJECT_STORAGE_BUCKET
              valueFrom:
                configMapKeyRef:
                  name: secureops-data-plane-config
                  key: object-storage-bucket
            - name: OBJECT_STORAGE_REGION
              valueFrom:
                configMapKeyRef:
                  name: secureops-data-plane-config
                  key: object-storage-region
            - name: REGION
              valueFrom:
                configMapKeyRef:
                  name: secureops-data-plane-config
                  key: region
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "4Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: data-storage
              mountPath: /app/data
      volumes:
        - name: data-storage
          persistentVolumeClaim:
            claimName: secureops-data-plane-storage
