apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: secureops-data-plane
  namespace: secureops
  labels:
    app: secureops
    plane: data
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["get", "list", "watch", "create", "update", "patch", "delete"]
  - apiGroups: [""]
    resources: ["configmaps"]
    verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: secureops-data-plane
  namespace: secureops
  labels:
    app: secureops
    plane: data
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: secureops-data-plane
subjects:
  - kind: ServiceAccount
    name: secureops-data-plane
    namespace: secureops
