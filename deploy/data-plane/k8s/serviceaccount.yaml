apiVersion: v1
kind: ServiceAccount
metadata:
  name: secureops-data-plane
  namespace: secureops
  labels:
    app: secureops
    plane: data
  annotations:
    # --- AWS IRSA (uncomment and set ARN) ---
    # eks.amazonaws.com/role-arn: "arn:aws:iam::ACCOUNT_ID:role/secureops-data-plane-role"
    # --- Azure Workload Identity (uncomment and set client ID) ---
    # azure.workload.identity/client-id: "CLIENT_ID"
    # azure.workload.identity/tenant-id: "TENANT_ID"
    # --- GCP Workload Identity (uncomment and set GSA) ---
    # iam.gke.io/gcp-service-account: "secureops-data-plane@PROJECT_ID.iam.gserviceaccount.com"
automountServiceAccountToken: true
