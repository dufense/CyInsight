##############################################################################
# Cyber Command Center -- AWS VPC (Management + Data Plane)
#
# Creates a 3-tier VPC:
#   - Public subnets   (ALB / NLB, 2 AZs)
#   - Private subnets  (ECS tasks / MSK / ClickHouse, 2 AZs)
#   - Isolated subnets (Aurora, no internet route, 2 AZs)
#
# Also creates:
#   - Internet Gateway
#   - NAT Gateways (one per AZ for HA)
#   - VPC Endpoints (S3 Gateway, Glue, Secrets Manager)
#   - VPC Flow Logs to CloudWatch
#   - Security Groups (ALB, ECS, Aurora, MSK, ClickHouse)
#
# GRC Shield lessons applied:
#   - No Unicode em-dashes in any GroupDescription
#   - Fn::ImportValue syntax for cross-stack (not !ImportValue !Sub)
#   - Isolated DB subnet tier fully air-gapped (no NAT route)
#
# Deploy:
#   aws cloudformation deploy \
#     --template-file deploy/aws/cloudformation/01-vpc.yml \
#     --stack-name ccc-vpc \
#     --parameter-overrides EnvironmentName=production VpcCidr=10.10.0.0/16
##############################################################################

AWSTemplateFormatVersion: "2010-09-09"
Description: "Cyber Command Center -- 3-Tier VPC with VPC Endpoints and Flow Logs"

Parameters:

  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  VpcCidr:
    Type: String
    Default: "10.10.0.0/16"
    Description: CIDR block for the VPC

  PublicSubnet1Cidr:
    Type: String
    Default: "10.10.1.0/24"

  PublicSubnet2Cidr:
    Type: String
    Default: "10.10.2.0/24"

  PrivateSubnet1Cidr:
    Type: String
    Default: "10.10.10.0/24"

  PrivateSubnet2Cidr:
    Type: String
    Default: "10.10.11.0/24"

  PrivateSubnet3Cidr:
    Type: String
    Default: "10.10.12.0/24"
    Description: Third private subnet (AZ3) for MSK 3-broker topology

  IsolatedSubnet1Cidr:
    Type: String
    Default: "10.10.20.0/24"
    Description: Isolated subnet for Aurora (no internet route)

  IsolatedSubnet2Cidr:
    Type: String
    Default: "10.10.21.0/24"
    Description: Isolated subnet for Aurora (no internet route)

  FlowLogsRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Resources:

  # ── VPC ─────────────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "ccc-vpc-${EnvironmentName}"
        - Key: Project
          Value: CyberCommandCenter
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "ccc-igw-${EnvironmentName}"
        - Key: Project
          Value: CyberCommandCenter

  InternetGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ── Public Subnets (ALB / NLB) ──────────────────────────────────────────────
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "ccc-public-1-${EnvironmentName}"
        - Key: Tier
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: true
      Tags:
        - Key: Name
          Value: !Sub "ccc-public-2-${EnvironmentName}"
        - Key: Tier
          Value: public

  # ── Private Subnets (ECS / MSK / ClickHouse) ────────────────────────────────
  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-private-1-${EnvironmentName}"
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-private-2-${EnvironmentName}"
        - Key: Tier
          Value: private

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-private-3-${EnvironmentName}"
        - Key: Tier
          Value: private

  # ── Isolated Subnets (Aurora DB, no internet) ───────────────────────────────
  IsolatedSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-isolated-1-${EnvironmentName}"
        - Key: Tier
          Value: isolated

  IsolatedSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-isolated-2-${EnvironmentName}"
        - Key: Tier
          Value: isolated

  # ── NAT Gateways (one per AZ for HA) ────────────────────────────────────────
  NatEIP1:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "ccc-nat-eip-1-${EnvironmentName}"

  NatEIP2:
    Type: AWS::EC2::EIP
    DependsOn: InternetGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "ccc-nat-eip-2-${EnvironmentName}"

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "ccc-nat-1-${EnvironmentName}"

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub "ccc-nat-2-${EnvironmentName}"

  # ── Route Tables ─────────────────────────────────────────────────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-public-rt-${EnvironmentName}"

  PublicRoute:
    Type: AWS::EC2::Route
    DependsOn: InternetGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-private-rt-1-${EnvironmentName}"

  PrivateRoute1:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway1

  PrivateSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-private-rt-2-${EnvironmentName}"

  PrivateRoute2:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  # Third private subnet (AZ3) uses a dedicated route table with NAT from AZ2
  PrivateRouteTable3:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-private-rt-3-${EnvironmentName}"

  PrivateRoute3:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTable3
      DestinationCidrBlock: "0.0.0.0/0"
      # Reuse NAT2 for AZ3 (cost-optimized; deploy dedicated NAT3 if strict AZ isolation required)
      NatGatewayId: !Ref NatGateway2

  PrivateSubnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable3

  # Isolated subnets have no internet route (fully air-gapped)
  IsolatedRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-isolated-rt-${EnvironmentName}"

  IsolatedSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet1
      RouteTableId: !Ref IsolatedRouteTable

  IsolatedSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet2
      RouteTableId: !Ref IsolatedRouteTable

  # ── VPC Endpoints (avoid NAT charges for AWS service traffic) ───────────────
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
        - !Ref IsolatedRouteTable

  GlueInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.glue"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  AthenaInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.athena"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  KMSInterfaceEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.kms"
      VpcEndpointType: Interface
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
      SecurityGroupIds:
        - !Ref VPCEndpointSecurityGroup
      PrivateDnsEnabled: true

  # ── VPC Flow Logs ────────────────────────────────────────────────────────────
  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/vpc/ccc-flow-logs-${EnvironmentName}"
      RetentionInDays: !Ref FlowLogsRetentionDays

  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ccc-vpc-flow-log-role-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: FlowLogsCloudWatch
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogGroup
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogGroup.Arn

  VPCFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      VpcId: !Ref VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn
      Tags:
        - Key: Name
          Value: !Sub "ccc-flow-log-${EnvironmentName}"

  # ── Security Groups ──────────────────────────────────────────────────────────
  VPCEndpointSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ccc-vpce-sg-${EnvironmentName}"
      GroupDescription: VPC Endpoints - allow HTTPS from private subnets
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: !Ref VpcCidr
          Description: HTTPS from VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-vpce-sg-${EnvironmentName}"

  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ccc-alb-sg-${EnvironmentName}"
      GroupDescription: ALB - allow inbound HTTP/HTTPS from internet
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: HTTP redirect
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: HTTPS
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIpv6: "::/0"
          Description: HTTP IPv6 redirect
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIpv6: "::/0"
          Description: HTTPS IPv6
      Tags:
        - Key: Name
          Value: !Sub "ccc-alb-sg-${EnvironmentName}"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ccc-ecs-sg-${EnvironmentName}"
      GroupDescription: ECS tasks - allow app port from ALB and internal traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: From ALB
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          CidrIp: !Ref VpcCidr
          Description: Internal VPC traffic (plane-to-plane)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub "ccc-ecs-sg-${EnvironmentName}"

  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ccc-aurora-sg-${EnvironmentName}"
      GroupDescription: Aurora PostgreSQL - allow port 5432 from ECS tasks only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: From ECS tasks
      Tags:
        - Key: Name
          Value: !Sub "ccc-aurora-sg-${EnvironmentName}"

  MSKSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupName: !Sub "ccc-msk-sg-${EnvironmentName}"
      GroupDescription: MSK Kafka - allow Kafka and ZooKeeper from ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9092
          ToPort: 9092
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: Kafka plaintext from ECS (disabled in prod)
        - IpProtocol: tcp
          FromPort: 9094
          ToPort: 9094
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: Kafka TLS from ECS
        - IpProtocol: tcp
          FromPort: 9096
          ToPort: 9096
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: Kafka IAM auth from ECS
      Tags:
        - Key: Name
          Value: !Sub "ccc-msk-sg-${EnvironmentName}"

Outputs:

  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  VpcCidr:
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"

  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1Id"

  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2Id"

  PublicSubnetIds:
    Description: Comma-separated list of public subnet IDs
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"

  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2Id"

  PrivateSubnet3Id:
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet3Id"

  PrivateSubnetIds:
    Description: Comma-separated list of private subnet IDs
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"

  IsolatedSubnet1Id:
    Value: !Ref IsolatedSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-IsolatedSubnet1Id"

  IsolatedSubnet2Id:
    Value: !Ref IsolatedSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-IsolatedSubnet2Id"

  IsolatedSubnetIds:
    Description: Comma-separated list of isolated subnet IDs (for Aurora)
    Value: !Join [",", [!Ref IsolatedSubnet1, !Ref IsolatedSubnet2]]
    Export:
      Name: !Sub "${AWS::StackName}-IsolatedSubnetIds"

  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ALBSecurityGroupId"

  ECSSecurityGroupId:
    Value: !Ref ECSSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ECSSecurityGroupId"

  AuroraSecurityGroupId:
    Value: !Ref AuroraSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AuroraSecurityGroupId"

  MSKSecurityGroupId:
    Value: !Ref MSKSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-MSKSecurityGroupId"

  # ── NAT Gateway Public EIPs (used by remote data planes for ALB allowlisting) ─
  NatEip1:
    Description: NAT Gateway EIP for AZ1 -- inject into data plane AlbScheme=internet-facing stacks
    Value: !GetAtt NatEIP1.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-NatEip1"

  NatEip2:
    Description: NAT Gateway EIP for AZ2 -- inject into data plane AlbScheme=internet-facing stacks
    Value: !GetAtt NatEIP2.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-NatEip2"

  PrivateRouteTable1Id:
    Description: Private route table for AZ1 (used by cross-region security peering stack)
    Value: !Ref PrivateRouteTable1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateRouteTable1Id"

  PrivateRouteTable2Id:
    Description: Private route table for AZ2 (used by cross-region security peering stack)
    Value: !Ref PrivateRouteTable2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateRouteTable2Id"
