##############################################################################
# Cyber Command Center -- Amazon OpenSearch Service (Hot Tier)
#
# 30-day hot tier for real-time security event search, alert queries,
# and SOC analyst investigation. Events older than 30 days transition
# to UltraWarm (31-90 days) and then to the S3 Iceberg data lake.
#
# Creates:
#   - OpenSearch 2.x domain (3 data nodes + 3 dedicated master nodes)
#   - UltraWarm nodes (r6gd.xlarge) for 31-90 day warm tier
#   - Cold storage enabled (91+ days before Iceberg)
#   - FGAC (Fine-Grained Access Control) with internal users
#   - Node-to-node encryption + encryption at rest
#   - VPC access (no public endpoint)
#   - Index lifecycle policy via ISM (Index State Management)
#   - CloudWatch alarms (cluster health, JVM pressure, free storage)
#   - Secrets Manager secret for admin credentials
#
# Depends on: 01-vpc.yml (exports PrivateSubnetIds, OpenSearchSecurityGroupId)
#
# ── Capacity & Sizing Guide (100–500 GB/day event throughput) ─────────────────
# DataInstanceType: r6g.xlarge.search — 4 vCPU / 32 GiB; memory-optimised for large shards
# DataVolumeSize:   500 GiB per data node × 3 nodes = 1.5 TiB hot storage
# UltraWarmType:    ultrawarm1.large.search — cost-efficient warm tier for 31-90 day data
# UltraWarmCount:   3 nodes (increased from 2 for higher warm-tier parallelism)
# Previous sizing (r6g.large / 30 GiB / 2 UltraWarm medium) supported ≤50 GB/day.
#
# Deploy:
#   aws cloudformation deploy \
#     --template-file deploy/aws/cloudformation/04-opensearch.yml \
#     --stack-name ccc-opensearch \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#       VpcStackName=ccc-vpc \
#       MasterUserPassword=<password> \
#       EnvironmentName=production
##############################################################################

AWSTemplateFormatVersion: "2010-09-09"
Description: "Cyber Command Center -- OpenSearch Service (30-day hot tier + UltraWarm)"

Parameters:

  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  VpcStackName:
    Type: String
    Default: ccc-vpc

  OpenSearchVersion:
    Type: String
    Default: "OpenSearch_2.17"
    AllowedValues:
      - "OpenSearch_2.17"
      - "OpenSearch_2.15"
      - "OpenSearch_2.13"

  DataNodeInstanceType:
    Type: String
    Default: r6g.xlarge.search
    AllowedValues:
      - r6g.large.search
      - r6g.xlarge.search
      - r6g.2xlarge.search
      - r6gd.large.search
      - r6gd.xlarge.search
    Description: "r6g.xlarge.search (4 vCPU, 32 GB) sized for 100-500 GB/day hot-tier indexing"

  DataNodeCount:
    Type: Number
    Default: 3
    AllowedValues: [3, 6, 9]
    Description: Must be multiple of 3 (AZ distribution)

  DataNodeEBSGB:
    Type: Number
    Default: 500
    MinValue: 10
    Description: EBS storage per data node in GB (500 GB per node = 1.5 TB total hot tier)

  UltraWarmNodeType:
    Type: String
    Default: ultrawarm1.large.search
    AllowedValues:
      - ultrawarm1.medium.search
      - ultrawarm1.large.search
      - ultrawarm1.xlarge.search
    Description: "ultrawarm1.large for 31-90 day warm tier at 100-500 GB/day ingest scale"

  UltraWarmNodeCount:
    Type: Number
    Default: 3
    AllowedValues: [2, 3]
    Description: 3 UltraWarm nodes for 3-AZ HA warm tier

  MasterNodeType:
    Type: String
    Default: r6g.large.search
    AllowedValues:
      - r6g.large.search
      - r6g.xlarge.search
      - r6g.2xlarge.search

  MasterUserName:
    Type: String
    Default: ccc_opensearch_admin

  MasterUserPassword:
    Type: String
    NoEcho: true
    MinLength: 8

Resources:

  # ── OpenSearch Domain ────────────────────────────────────────────────────────
  OpenSearchDomain:
    Type: AWS::OpenSearchService::Domain
    DependsOn: OpenSearchLogResourcePolicy
    Properties:
      DomainName: !Sub "ccc-events-${EnvironmentName}"
      EngineVersion: !Ref OpenSearchVersion

      ClusterConfig:
        InstanceType: !Ref DataNodeInstanceType
        InstanceCount: !Ref DataNodeCount
        ZoneAwarenessEnabled: true
        ZoneAwarenessConfig:
          AvailabilityZoneCount: 2
        DedicatedMasterEnabled: true
        DedicatedMasterType: !Ref MasterNodeType
        DedicatedMasterCount: 3
        WarmEnabled: true
        WarmType: !Ref UltraWarmNodeType
        WarmCount: !Ref UltraWarmNodeCount
        ColdStorageOptions:
          Enabled: true

      EBSOptions:
        EBSEnabled: true
        VolumeType: gp3
        VolumeSize: !Ref DataNodeEBSGB
        Throughput: 250
        Iops: 3000

      VPCOptions:
        SubnetIds:
          - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet2Id"
        SecurityGroupIds:
          - Fn::ImportValue: !Sub "${VpcStackName}-OpenSearchSecurityGroupId"

      EncryptionAtRestOptions:
        Enabled: true

      NodeToNodeEncryptionOptions:
        Enabled: true

      DomainEndpointOptions:
        EnforceHTTPS: true
        TLSSecurityPolicy: Policy-Min-TLS-1-2-2019-07

      AdvancedSecurityOptions:
        Enabled: true
        InternalUserDatabaseEnabled: true
        MasterUserOptions:
          MasterUserName: !Ref MasterUserName
          MasterUserPassword: !Ref MasterUserPassword

      AccessPolicies:
        Version: "2012-10-17"
        # NOTE on principal ordering: ECS task roles (stacks 06/07) are created
        # AFTER this stack (04). CloudFormation validates Principal ARNs at stack
        # creation time, so referencing specific role ARNs that don't yet exist
        # causes a deployment failure. The pattern below uses the account-root
        # principal (always valid) with an ArnLike condition that is evaluated
        # at request time once the roles exist — preserving least-privilege intent
        # without creating a cross-stack ordering dependency.
        Statement:
          # Allow management-plane task role (no region suffix).
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Condition:
              ArnLike:
                "aws:PrincipalArn": !Sub "arn:aws:iam::${AWS::AccountId}:role/ccc-management-task-role-${EnvironmentName}"
            Action:
              - "es:ESHttpGet"
              - "es:ESHttpPost"
              - "es:ESHttpPut"
              - "es:ESHttpDelete"
              - "es:ESHttpHead"
              - "es:ESHttpPatch"
              - "es:DescribeDomain"
            Resource:
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ccc-events-${EnvironmentName}"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ccc-events-${EnvironmentName}/*"
          # Allow data-plane task roles from all 5 data-plane regions.
          # Data-plane task roles include the region in the name:
          #   ccc-data-plane-task-role-<DataPlaneRegion>-<EnvironmentName>
          - Effect: Allow
            Principal:
              AWS: !Sub "arn:aws:iam::${AWS::AccountId}:root"
            Condition:
              ArnLike:
                "aws:PrincipalArn":
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ccc-data-plane-task-role-in-west-1-${EnvironmentName}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ccc-data-plane-task-role-us-east-1-${EnvironmentName}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ccc-data-plane-task-role-ke-east-1-${EnvironmentName}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ccc-data-plane-task-role-sa-central-1-${EnvironmentName}"
                  - !Sub "arn:aws:iam::${AWS::AccountId}:role/ccc-data-plane-task-role-bh-east-1-${EnvironmentName}"
            Action:
              - "es:ESHttpGet"
              - "es:ESHttpPost"
              - "es:ESHttpPut"
              - "es:ESHttpDelete"
              - "es:ESHttpHead"
              - "es:ESHttpPatch"
              - "es:DescribeDomain"
            Resource:
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ccc-events-${EnvironmentName}"
              - !Sub "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ccc-events-${EnvironmentName}/*"

      AdvancedOptions:
        rest.action.multi.allow_explicit_index: "true"
        indices.fielddata.cache.size: "40"
        indices.query.bool.max_clause_count: "1024"

      LogPublishingOptions:
        SEARCH_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt SearchSlowLogGroup.Arn
          Enabled: true
        INDEX_SLOW_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt IndexSlowLogGroup.Arn
          Enabled: true
        ES_APPLICATION_LOGS:
          CloudWatchLogsLogGroupArn: !GetAtt ApplicationLogGroup.Arn
          Enabled: true

      SoftwareUpdateOptions:
        AutoSoftwareUpdateEnabled: true

      Tags:
        - Key: Project
          Value: CyberCommandCenter
        - Key: Plane
          Value: data
        - Key: Environment
          Value: !Ref EnvironmentName

  # ── Log Groups ───────────────────────────────────────────────────────────────
  SearchSlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/opensearch/ccc-${EnvironmentName}/search-slow-logs"
      RetentionInDays: 30

  IndexSlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/opensearch/ccc-${EnvironmentName}/index-slow-logs"
      RetentionInDays: 30

  ApplicationLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/opensearch/ccc-${EnvironmentName}/application-logs"
      RetentionInDays: 30

  # ── CloudWatch Logs Resource Policy ──────────────────────────────────────────
  # Required for OpenSearch LogPublishingOptions to write to CloudWatch.
  # Without this, OpenSearch domain creation fails with "Could not write to CW".
  # This resource policy grants es.amazonaws.com permission to write to all
  # three CCC OpenSearch log groups created above.
  OpenSearchLogResourcePolicy:
    Type: AWS::Logs::ResourcePolicy
    DependsOn:
      - SearchSlowLogGroup
      - IndexSlowLogGroup
      - ApplicationLogGroup
    Properties:
      PolicyName: !Sub "ccc-opensearch-${EnvironmentName}-log-policy"
      PolicyDocument: !Sub |
        {
          "Version": "2012-10-17",
          "Statement": [
            {
              "Effect": "Allow",
              "Principal": {
                "Service": "es.amazonaws.com"
              },
              "Action": [
                "logs:PutLogEvents",
                "logs:CreateLogGroup",
                "logs:CreateLogStream"
              ],
              "Resource": [
                "arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/opensearch/ccc-${EnvironmentName}/*:*"
              ],
              "Condition": {
                "StringEquals": {
                  "aws:SourceAccount": "${AWS::AccountId}"
                },
                "ArnLike": {
                  "aws:SourceArn": "arn:aws:es:${AWS::Region}:${AWS::AccountId}:domain/ccc-events-${EnvironmentName}"
                }
              }
            }
          ]
        }

  # ── Secrets Manager ──────────────────────────────────────────────────────────
  OpenSearchSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ccc/data-plane/opensearch-credentials-${EnvironmentName}"
      Description: "CCC OpenSearch admin credentials and endpoint"
      SecretString: !Sub |
        {
          "username": "${MasterUserName}",
          "password": "${MasterUserPassword}",
          "endpoint": "https://${OpenSearchDomain.DomainEndpoint}",
          "OPENSEARCH_URL": "https://${OpenSearchDomain.DomainEndpoint}",
          "OPENSEARCH_USERNAME": "${MasterUserName}",
          "OPENSEARCH_PASSWORD": "${MasterUserPassword}"
        }
      Tags:
        - Key: Project
          Value: CyberCommandCenter

  # ── CloudWatch Alarms ────────────────────────────────────────────────────────
  AlarmClusterRed:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ccc-opensearch-${EnvironmentName}-cluster-red"
      AlarmDescription: OpenSearch cluster status is RED - data loss or unavailability
      Namespace: AWS/ES
      MetricName: ClusterStatus.red
      Dimensions:
        - Name: DomainName
          Value: !Sub "ccc-events-${EnvironmentName}"
        - Name: ClientId
          Value: !Ref AWS::AccountId
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  AlarmClusterYellow:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ccc-opensearch-${EnvironmentName}-cluster-yellow"
      AlarmDescription: OpenSearch cluster status is YELLOW - some replicas unavailable
      Namespace: AWS/ES
      MetricName: ClusterStatus.yellow
      Dimensions:
        - Name: DomainName
          Value: !Sub "ccc-events-${EnvironmentName}"
        - Name: ClientId
          Value: !Ref AWS::AccountId
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 3
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  AlarmHighJVM:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ccc-opensearch-${EnvironmentName}-high-jvm"
      AlarmDescription: OpenSearch JVM memory pressure above 85%
      Namespace: AWS/ES
      MetricName: JVMMemoryPressure
      Dimensions:
        - Name: DomainName
          Value: !Sub "ccc-events-${EnvironmentName}"
        - Name: ClientId
          Value: !Ref AWS::AccountId
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold

  AlarmLowFreeStorage:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ccc-opensearch-${EnvironmentName}-low-free-storage"
      AlarmDescription: OpenSearch free storage below 20 GB per node
      Namespace: AWS/ES
      MetricName: FreeStorageSpace
      Dimensions:
        - Name: DomainName
          Value: !Sub "ccc-events-${EnvironmentName}"
        - Name: ClientId
          Value: !Ref AWS::AccountId
      Statistic: Minimum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 20480
      ComparisonOperator: LessThanThreshold

Outputs:

  DomainEndpoint:
    Description: OpenSearch domain HTTPS endpoint
    Value: !Sub "https://${OpenSearchDomain.DomainEndpoint}"
    Export:
      Name: !Sub "${AWS::StackName}-DomainEndpoint"

  DomainArn:
    Value: !GetAtt OpenSearchDomain.Arn
    Export:
      Name: !Sub "${AWS::StackName}-DomainArn"

  DomainName:
    Value: !Sub "ccc-events-${EnvironmentName}"
    Export:
      Name: !Sub "${AWS::StackName}-DomainName"

  OpenSearchSecretArn:
    Description: Secrets Manager ARN with OPENSEARCH_URL and credentials
    Value: !Ref OpenSearchSecret
    Export:
      Name: !Sub "${AWS::StackName}-OpenSearchSecretArn"
