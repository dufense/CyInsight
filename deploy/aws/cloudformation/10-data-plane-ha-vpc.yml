##############################################################################
# Cyber Command Center -- Data Plane HA VPC (3-AZ, Per-Region)
#
# Creates a production-grade 3-tier VPC for CCC data plane regions:
#
#   Multi-Region HA Topology
#   ────────────────────────────────────────────────────────────────────────
#   Region             Stack Name            VPC CIDR
#   ap-south-1 (mgmt)  ccc-vpc               10.10.0.0/16  (01-vpc.yml)
#   ap-south-1 (dp)    ccc-dp-vpc-mumbai     10.20.0.0/16  (this template)
#   me-south-1 (dp)    ccc-dp-vpc-bahrain    10.30.0.0/16  (this template)
#   af-south-1 (dp)    ccc-dp-vpc-kenya      10.40.0.0/16  (this template)
#
# VPC layout per region (3 AZs):
#   - Public subnets   AZ1/AZ2/AZ3  -- internet-facing ALB (Bahrain/Kenya)
#   - Private subnets  AZ1/AZ2/AZ3  -- ECS Fargate tasks (all regions)
#   - Isolated subnets AZ1/AZ2/AZ3  -- Aurora PostgreSQL (no internet route)
#
# HA features:
#   - NAT Gateway per AZ (3 NATs) -- no single-AZ outbound dependency
#   - VPC Endpoints (S3 Gateway, Secrets Manager Interface)
#   - VPC Flow Logs to CloudWatch
#   - Security Groups mirroring management plane (ALB, ECS, Aurora, MSK, OpenSearch)
#
# VPC Peering (Mumbai only):
#   When PeeringRequesterVpcId is set (management plane VPC ID), this template
#   creates a VPC Peering connection from the data plane VPC to the management
#   VPC and adds private route table entries for the management CIDR.
#   For Bahrain and Kenya, leave PeeringRequesterVpcId empty.
#
# GRC Shield lessons applied:
#   - No em-dashes in GroupDescription
#   - Fn::ImportValue syntax (not !ImportValue !Sub)
#   - CIDR blocks must not overlap across peered VPCs
#
# Deploy (mumbai -- same region as management, with VPC peering):
#   aws cloudformation deploy \
#     --template-file deploy/aws/cloudformation/10-data-plane-ha-vpc.yml \
#     --stack-name ccc-dp-vpc-mumbai \
#     --region ap-south-1 \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#       DataPlaneId=mumbai \
#       VpcCidr=10.20.0.0/16 \
#       PeeringRequesterVpcId=vpc-XXXXXXXXXXXX \
#       PeeringRequesterCidr=10.10.0.0/16 \
#       ManagementAwsAccountId=123456789012
#
# Deploy (bahrain -- remote region, no VPC peering):
#   aws cloudformation deploy \
#     --template-file deploy/aws/cloudformation/10-data-plane-ha-vpc.yml \
#     --stack-name ccc-dp-vpc-bahrain \
#     --region me-south-1 \
#     --capabilities CAPABILITY_NAMED_IAM \
#     --parameter-overrides \
#       DataPlaneId=bahrain \
#       VpcCidr=10.30.0.0/16
##############################################################################

AWSTemplateFormatVersion: "2010-09-09"
Description: "Cyber Command Center -- Data Plane HA VPC (3-AZ, per region)"

Parameters:

  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  DataPlaneId:
    Type: String
    AllowedValues: [mumbai, bahrain, kenya]
    Description: Logical data plane identifier -- used in resource names and tags.

  VpcCidr:
    Type: String
    Description: >-
      VPC CIDR block. Must not overlap with other peered VPCs.
      mumbai=10.20.0.0/16, bahrain=10.30.0.0/16, kenya=10.40.0.0/16

  # ── Subnet CIDRs (defaults match mumbai=10.20.x.x; override for other regions) ─
  PublicSubnet1Cidr:
    Type: String
    Default: "10.20.1.0/24"
  PublicSubnet2Cidr:
    Type: String
    Default: "10.20.2.0/24"
  PublicSubnet3Cidr:
    Type: String
    Default: "10.20.3.0/24"
    Description: Third public subnet (AZ3) for 3-AZ internet-facing ALB spread.

  PrivateSubnet1Cidr:
    Type: String
    Default: "10.20.10.0/24"
  PrivateSubnet2Cidr:
    Type: String
    Default: "10.20.11.0/24"
  PrivateSubnet3Cidr:
    Type: String
    Default: "10.20.12.0/24"
    Description: Third private subnet (AZ3) for ECS 3-AZ task spread.

  IsolatedSubnet1Cidr:
    Type: String
    Default: "10.20.20.0/24"
    Description: Isolated subnet for Aurora (no internet route).
  IsolatedSubnet2Cidr:
    Type: String
    Default: "10.20.21.0/24"
  IsolatedSubnet3Cidr:
    Type: String
    Default: "10.20.22.0/24"

  # ── VPC Peering (Mumbai only) ───────────────────────────────────────────────
  PeeringRequesterVpcId:
    Type: String
    Default: ""
    Description: >-
      Management plane VPC ID. When set, creates a VPC Peering connection
      and adds private routes toward the management CIDR.
      Leave empty for Bahrain and Kenya (they use internet-facing ALBs).

  PeeringRequesterCidr:
    Type: String
    Default: "10.10.0.0/16"
    Description: >-
      Management plane VPC CIDR block (default 10.10.0.0/16).
      Only used when PeeringRequesterVpcId is set.

  ManagementAwsAccountId:
    Type: String
    Default: ""
    Description: >-
      AWS account ID that owns the management VPC.
      Required for cross-account VPC peering; omit for same-account.

  FlowLogsRetentionDays:
    Type: Number
    Default: 30
    AllowedValues: [7, 14, 30, 60, 90, 180, 365]

Conditions:
  HasVpcPeering:           !Not [!Equals [!Ref PeeringRequesterVpcId, ""]]
  HasMgmtAccountOverride:  !Not [!Equals [!Ref ManagementAwsAccountId, ""]]

Resources:

  # ── VPC ─────────────────────────────────────────────────────────────────────
  VPC:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: !Ref VpcCidr
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-vpc-${DataPlaneId}-${EnvironmentName}"
        - Key: Project
          Value: CyberCommandCenter
        - Key: DataPlaneId
          Value: !Ref DataPlaneId
        - Key: Environment
          Value: !Ref EnvironmentName

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-igw-${DataPlaneId}-${EnvironmentName}"
        - Key: Project
          Value: CyberCommandCenter

  VPCGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref VPC
      InternetGatewayId: !Ref InternetGateway

  # ── Subnets ──────────────────────────────────────────────────────────────────
  PublicSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-public-1-${DataPlaneId}"
        - Key: Tier
          Value: public

  PublicSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-public-2-${DataPlaneId}"
        - Key: Tier
          Value: public

  PublicSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PublicSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs ""]
      MapPublicIpOnLaunch: false
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-public-3-${DataPlaneId}"
        - Key: Tier
          Value: public

  PrivateSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-private-1-${DataPlaneId}"
        - Key: Tier
          Value: private

  PrivateSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-private-2-${DataPlaneId}"
        - Key: Tier
          Value: private

  PrivateSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref PrivateSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-private-3-${DataPlaneId}"
        - Key: Tier
          Value: private

  IsolatedSubnet1:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet1Cidr
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-isolated-1-${DataPlaneId}"
        - Key: Tier
          Value: isolated

  IsolatedSubnet2:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet2Cidr
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-isolated-2-${DataPlaneId}"
        - Key: Tier
          Value: isolated

  IsolatedSubnet3:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref VPC
      CidrBlock: !Ref IsolatedSubnet3Cidr
      AvailabilityZone: !Select [2, !GetAZs ""]
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-isolated-3-${DataPlaneId}"
        - Key: Tier
          Value: isolated

  # ── NAT Gateways -- one per AZ for full outbound HA ─────────────────────────
  NatEIP1:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-nat-eip-1-${DataPlaneId}"

  NatEIP2:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-nat-eip-2-${DataPlaneId}"

  NatEIP3:
    Type: AWS::EC2::EIP
    DependsOn: VPCGatewayAttachment
    Properties:
      Domain: vpc
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-nat-eip-3-${DataPlaneId}"

  NatGateway1:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP1.AllocationId
      SubnetId: !Ref PublicSubnet1
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-nat-1-${DataPlaneId}"

  NatGateway2:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP2.AllocationId
      SubnetId: !Ref PublicSubnet2
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-nat-2-${DataPlaneId}"

  NatGateway3:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEIP3.AllocationId
      SubnetId: !Ref PublicSubnet3
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-nat-3-${DataPlaneId}"

  # ── Public Route Table ───────────────────────────────────────────────────────
  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-rt-public-${DataPlaneId}"

  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VPCGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: "0.0.0.0/0"
      GatewayId: !Ref InternetGateway

  PublicSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet1
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet2
      RouteTableId: !Ref PublicRouteTable

  PublicSubnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PublicSubnet3
      RouteTableId: !Ref PublicRouteTable

  # ── Private Route Tables (one per AZ for per-AZ NAT) ────────────────────────
  PrivateRouteTable1:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-rt-private-az1-${DataPlaneId}"

  PrivateRouteTable2:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-rt-private-az2-${DataPlaneId}"

  PrivateRouteTable3:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-rt-private-az3-${DataPlaneId}"

  PrivateRoute1:
    Type: AWS::EC2::Route
    DependsOn: NatGateway1
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway1

  PrivateRoute2:
    Type: AWS::EC2::Route
    DependsOn: NatGateway2
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway2

  PrivateRoute3:
    Type: AWS::EC2::Route
    DependsOn: NatGateway3
    Properties:
      RouteTableId: !Ref PrivateRouteTable3
      DestinationCidrBlock: "0.0.0.0/0"
      NatGatewayId: !Ref NatGateway3

  PrivateSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet1
      RouteTableId: !Ref PrivateRouteTable1

  PrivateSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet2
      RouteTableId: !Ref PrivateRouteTable2

  PrivateSubnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref PrivateSubnet3
      RouteTableId: !Ref PrivateRouteTable3

  # ── Isolated Route Table (no NAT, no internet) ───────────────────────────────
  IsolatedRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref VPC
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-rt-isolated-${DataPlaneId}"

  IsolatedSubnet1RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet1
      RouteTableId: !Ref IsolatedRouteTable

  IsolatedSubnet2RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet2
      RouteTableId: !Ref IsolatedRouteTable

  IsolatedSubnet3RTA:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties:
      SubnetId: !Ref IsolatedSubnet3
      RouteTableId: !Ref IsolatedRouteTable

  # ── VPC Peering (Mumbai <-> Management, same AWS region) ─────────────────────
  # Creates a VPC Peering connection from this data plane VPC to the management
  # plane VPC and adds private routes. Only for Mumbai (same AWS region).
  VpcPeeringConnection:
    Type: AWS::EC2::VPCPeeringConnection
    Condition: HasVpcPeering
    Properties:
      VpcId: !Ref VPC
      PeerVpcId: !Ref PeeringRequesterVpcId
      PeerOwnerId: !If
        - HasMgmtAccountOverride
        - !Ref ManagementAwsAccountId
        - !Ref AWS::AccountId
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-peering-${DataPlaneId}-to-management"
        - Key: Project
          Value: CyberCommandCenter

  # Route from data plane private subnets to management VPC via peering
  PeeringRoute1:
    Type: AWS::EC2::Route
    Condition: HasVpcPeering
    DependsOn: VpcPeeringConnection
    Properties:
      RouteTableId: !Ref PrivateRouteTable1
      DestinationCidrBlock: !Ref PeeringRequesterCidr
      VpcPeeringConnectionId: !Ref VpcPeeringConnection

  PeeringRoute2:
    Type: AWS::EC2::Route
    Condition: HasVpcPeering
    DependsOn: VpcPeeringConnection
    Properties:
      RouteTableId: !Ref PrivateRouteTable2
      DestinationCidrBlock: !Ref PeeringRequesterCidr
      VpcPeeringConnectionId: !Ref VpcPeeringConnection

  PeeringRoute3:
    Type: AWS::EC2::Route
    Condition: HasVpcPeering
    DependsOn: VpcPeeringConnection
    Properties:
      RouteTableId: !Ref PrivateRouteTable3
      DestinationCidrBlock: !Ref PeeringRequesterCidr
      VpcPeeringConnectionId: !Ref VpcPeeringConnection

  # ── VPC Endpoints ────────────────────────────────────────────────────────────
  S3Endpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds:
        - !Ref PrivateRouteTable1
        - !Ref PrivateRouteTable2
        - !Ref PrivateRouteTable3

  SecretsManagerEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref VPC
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.secretsmanager"
      VpcEndpointType: Interface
      PrivateDnsEnabled: true
      SubnetIds:
        - !Ref PrivateSubnet1
        - !Ref PrivateSubnet2
        - !Ref PrivateSubnet3
      SecurityGroupIds:
        - !Ref ECSSecurityGroup

  # ── VPC Flow Logs ─────────────────────────────────────────────────────────────
  FlowLogsLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/vpc/ccc-dp-${DataPlaneId}-${EnvironmentName}"
      RetentionInDays: !Ref FlowLogsRetentionDays

  FlowLogsRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "ccc-dp-flow-logs-role-${DataPlaneId}-${EnvironmentName}"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: vpc-flow-logs.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: CloudWatchLogsWrite
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - logs:CreateLogStream
                  - logs:PutLogEvents
                  - logs:DescribeLogGroups
                  - logs:DescribeLogStreams
                Resource: !GetAtt FlowLogsLogGroup.Arn

  VpcFlowLogs:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceType: VPC
      ResourceId: !Ref VPC
      TrafficType: ALL
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogsLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogsRole.Arn
      Tags:
        - Key: Project
          Value: CyberCommandCenter

  # ── Security Groups ───────────────────────────────────────────────────────────
  ALBSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CCC Data Plane ALB security group
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          CidrIp: "0.0.0.0/0"
          Description: HTTP
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: "0.0.0.0/0"
          Description: HTTPS
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-alb-sg-${DataPlaneId}"

  ECSSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CCC Data Plane ECS tasks - allow app port from ALB and internal traffic
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5000
          ToPort: 5000
          SourceSecurityGroupId: !Ref ALBSecurityGroup
          Description: From ALB
        - IpProtocol: "-1"
          CidrIp: !Ref VpcCidr
          Description: Internal VPC traffic (plane-to-plane)
      SecurityGroupEgress:
        - IpProtocol: "-1"
          CidrIp: "0.0.0.0/0"
          Description: Allow all outbound
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-ecs-sg-${DataPlaneId}"

  AuroraSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CCC Data Plane Aurora PostgreSQL - allow port 5432 from ECS tasks only
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 5432
          ToPort: 5432
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: From ECS tasks
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-aurora-sg-${DataPlaneId}"

  MSKSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CCC Data Plane MSK Kafka - allow Kafka and ZooKeeper from ECS
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 9094
          ToPort: 9094
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: Kafka TLS from ECS
        - IpProtocol: tcp
          FromPort: 9098
          ToPort: 9098
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: Kafka IAM auth from ECS
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-msk-sg-${DataPlaneId}"

  OpenSearchSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: CCC Data Plane OpenSearch - allow HTTPS from ECS tasks
      VpcId: !Ref VPC
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: OpenSearch HTTPS from ECS
        - IpProtocol: tcp
          FromPort: 9200
          ToPort: 9200
          SourceSecurityGroupId: !Ref ECSSecurityGroup
          Description: OpenSearch REST from ECS
      Tags:
        - Key: Name
          Value: !Sub "ccc-dp-opensearch-sg-${DataPlaneId}"

Outputs:

  VpcId:
    Value: !Ref VPC
    Export:
      Name: !Sub "${AWS::StackName}-VpcId"

  VpcCidr:
    Value: !Ref VpcCidr
    Export:
      Name: !Sub "${AWS::StackName}-VpcCidr"

  DataPlaneId:
    Value: !Ref DataPlaneId
    Export:
      Name: !Sub "${AWS::StackName}-DataPlaneId"

  # ── Public Subnets (for internet-facing ALBs -- Bahrain/Kenya) ───────────────
  PublicSubnet1Id:
    Value: !Ref PublicSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet1Id"

  PublicSubnet2Id:
    Value: !Ref PublicSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet2Id"

  PublicSubnet3Id:
    Value: !Ref PublicSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnet3Id"

  PublicSubnetIds:
    Description: Comma-separated public subnet IDs
    Value: !Join [",", [!Ref PublicSubnet1, !Ref PublicSubnet2, !Ref PublicSubnet3]]
    Export:
      Name: !Sub "${AWS::StackName}-PublicSubnetIds"

  # ── Private Subnets (ECS tasks across 3 AZs) ─────────────────────────────────
  PrivateSubnet1Id:
    Value: !Ref PrivateSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet1Id"

  PrivateSubnet2Id:
    Value: !Ref PrivateSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet2Id"

  PrivateSubnet3Id:
    Value: !Ref PrivateSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnet3Id"

  PrivateSubnetIds:
    Description: Comma-separated private subnet IDs
    Value: !Join [",", [!Ref PrivateSubnet1, !Ref PrivateSubnet2, !Ref PrivateSubnet3]]
    Export:
      Name: !Sub "${AWS::StackName}-PrivateSubnetIds"

  # ── Isolated Subnets (Aurora) ────────────────────────────────────────────────
  IsolatedSubnet1Id:
    Value: !Ref IsolatedSubnet1
    Export:
      Name: !Sub "${AWS::StackName}-IsolatedSubnet1Id"

  IsolatedSubnet2Id:
    Value: !Ref IsolatedSubnet2
    Export:
      Name: !Sub "${AWS::StackName}-IsolatedSubnet2Id"

  IsolatedSubnet3Id:
    Value: !Ref IsolatedSubnet3
    Export:
      Name: !Sub "${AWS::StackName}-IsolatedSubnet3Id"

  IsolatedSubnetIds:
    Description: Comma-separated isolated subnet IDs (for Aurora multi-AZ)
    Value: !Join [",", [!Ref IsolatedSubnet1, !Ref IsolatedSubnet2, !Ref IsolatedSubnet3]]
    Export:
      Name: !Sub "${AWS::StackName}-IsolatedSubnetIds"

  # ── NAT Gateway EIPs (exported for management VPC peering + cross-region docs) ─
  NatEip1:
    Description: NAT Gateway EIP AZ1
    Value: !GetAtt NatEIP1.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-NatEip1"

  NatEip2:
    Description: NAT Gateway EIP AZ2
    Value: !GetAtt NatEIP2.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-NatEip2"

  NatEip3:
    Description: NAT Gateway EIP AZ3
    Value: !GetAtt NatEIP3.PublicIp
    Export:
      Name: !Sub "${AWS::StackName}-NatEip3"

  # ── Security Groups ───────────────────────────────────────────────────────────
  ALBSecurityGroupId:
    Value: !Ref ALBSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ALBSecurityGroupId"

  ECSSecurityGroupId:
    Value: !Ref ECSSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-ECSSecurityGroupId"

  AuroraSecurityGroupId:
    Value: !Ref AuroraSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-AuroraSecurityGroupId"

  MSKSecurityGroupId:
    Value: !Ref MSKSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-MSKSecurityGroupId"

  OpenSearchSecurityGroupId:
    Value: !Ref OpenSearchSecurityGroup
    Export:
      Name: !Sub "${AWS::StackName}-OpenSearchSecurityGroupId"

  # ── VPC Peering (Mumbai only) ─────────────────────────────────────────────────
  VpcPeeringConnectionId:
    Condition: HasVpcPeering
    Description: >-
      VPC Peering connection ID. Pass this to the management plane's
      11-cross-region-security.yml stack (PeeringConnectionId parameter) so it
      can accept the connection and add management-side route table entries.
    Value: !Ref VpcPeeringConnection
    Export:
      Name: !Sub "${AWS::StackName}-VpcPeeringConnectionId"
