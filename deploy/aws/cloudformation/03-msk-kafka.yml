##############################################################################
# Cyber Command Center -- Amazon MSK (Managed Kafka) - Streaming Ingest
#
# Kafka cluster for ingesting petabyte-scale security events from:
#   - Receiver Plane (Syslog/CEF/Push API)
#   - Security tool connectors (Cynet, Checkpoint, Vicarius, etc.)
#   - Cross-tenant threat intelligence propagation
#
# Creates:
#   - MSK Kafka cluster (3 brokers, kafka.m5.large)
#   - Configuration (log retention, topic settings)
#   - CloudWatch alarms (under-replicated partitions, disk, producer lag)
#   - Secrets Manager secret for broker endpoints
#
# Security:
#   - TLS encryption in-transit only (plaintext disabled)
#   - At-rest encryption with AWS-managed KMS key
#   - In-VPC only (no public access)
#
# Depends on: 01-vpc.yml (exports PrivateSubnetIds, MSKSecurityGroupId)
#
# ── Capacity & Sizing Guide (100–500 GB/day event throughput) ─────────────────
# BrokerInstanceType: kafka.m5.xlarge  — 2 vCPU / 16 GiB; handles 500 MB/s per broker
# BrokerStorageGB:    1000 GiB per broker (autoscale to 4000 GiB at 70% full)
# VolumeThroughput:   500 MB/s (provisioned for burst writes from Receiver Plane)
# 3 brokers × 1000 GiB = 3 TiB raw; at 3× replication ≈ 1 TiB usable before autoscale.
# Previous sizing (m5.large / 500 GiB / 250 MB/s) was tuned for ≤50 GB/day ingest.
#
# Deploy:
#   aws cloudformation deploy \
#     --template-file deploy/aws/cloudformation/03-msk-kafka.yml \
#     --stack-name ccc-msk-kafka \
#     --parameter-overrides VpcStackName=ccc-vpc EnvironmentName=production
##############################################################################

AWSTemplateFormatVersion: "2010-09-09"
Description: "Cyber Command Center -- Amazon MSK Kafka Cluster (Streaming Ingest)"

Parameters:

  EnvironmentName:
    Type: String
    Default: production
    AllowedValues: [production, staging, development]

  VpcStackName:
    Type: String
    Default: ccc-vpc

  KafkaVersion:
    Type: String
    Default: "3.6.0"
    AllowedValues: ["3.6.0", "3.5.1", "3.4.0"]

  BrokerInstanceType:
    Type: String
    Default: kafka.m5.xlarge
    AllowedValues:
      - kafka.t3.small
      - kafka.m5.large
      - kafka.m5.xlarge
      - kafka.m5.2xlarge
      - kafka.m5.4xlarge
    Description: "m5.xlarge (4 vCPU, 16 GB) sized for 100-500 GB/day ingest throughput"

  BrokerStorageGB:
    Type: Number
    Default: 1000
    MinValue: 100
    MaxValue: 16384
    Description: EBS storage per broker in GB (1 TB default for 100-500 GB/day workloads)

  BrokerScalingMaxGB:
    Type: Number
    Default: 4000
    Description: Maximum storage per broker after auto-scaling (4 TB ceiling)

  RetentionHours:
    Type: Number
    Default: 72
    Description: Log retention in hours for raw event topics

Resources:

  # ── MSK Configuration ────────────────────────────────────────────────────────
  MSKConfiguration:
    Type: AWS::MSK::Configuration
    Properties:
      Name: !Sub "ccc-msk-config-${EnvironmentName}"
      Description: "CCC MSK Kafka configuration - security event streaming"
      KafkaVersionsList:
        - !Ref KafkaVersion
      ServerProperties: !Sub |
        # Replication
        default.replication.factor=3
        min.insync.replicas=2
        # Topic defaults (overridden per topic)
        num.partitions=12
        log.retention.hours=${RetentionHours}
        log.retention.bytes=107374182400
        log.segment.bytes=536870912
        # Performance
        num.network.threads=5
        num.io.threads=8
        socket.send.buffer.bytes=102400
        socket.receive.buffer.bytes=102400
        socket.request.max.bytes=104857600
        # Log cleaning (compact for incident/IOC topics)
        log.cleanup.policy=delete
        log.cleaner.enable=true
        # Auto topic creation disabled; topics are pre-created by the receiver plane on startup
        auto.create.topics.enable=false
        # Consumer group rebalancing
        group.initial.rebalance.delay.ms=3000

  # ── MSK Cluster ─────────────────────────────────────────────────────────────
  MSKCluster:
    Type: AWS::MSK::Cluster
    Properties:
      ClusterName: !Sub "ccc-msk-${EnvironmentName}"
      KafkaVersion: !Ref KafkaVersion
      NumberOfBrokerNodes: 3
      ConfigurationInfo:
        Arn: !GetAtt MSKConfiguration.Arn
        Revision: 1
      BrokerNodeGroupInfo:
        InstanceType: !Ref BrokerInstanceType
        ClientSubnets:
          - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet1Id"
          - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet2Id"
          # Third broker uses AZ3 subnet for genuine 3-AZ distribution
          - Fn::ImportValue: !Sub "${VpcStackName}-PrivateSubnet3Id"
        SecurityGroups:
          - Fn::ImportValue: !Sub "${VpcStackName}-MSKSecurityGroupId"
        StorageInfo:
          EBSStorageInfo:
            VolumeSize: !Ref BrokerStorageGB
            ProvisionedThroughput:
              Enabled: true
              VolumeThroughput: 500
      EncryptionInfo:
        EncryptionInTransit:
          ClientBroker: TLS
          InCluster: true
        EncryptionAtRest:
          EncryptionKey: !Sub "arn:aws:kms:${AWS::Region}:${AWS::AccountId}:alias/aws/kafka"
      ClientAuthentication:
        Unauthenticated:
          Enabled: false
        Tls:
          Enabled: false
        Sasl:
          Iam:
            Enabled: true
          Scram:
            Enabled: false
      LoggingInfo:
        BrokerLogs:
          CloudWatchLogs:
            Enabled: true
            LogGroup: !Ref MSKLogGroup
      EnhancedMonitoring: PER_TOPIC_PER_BROKER
      OpenMonitoring:
        Prometheus:
          JmxExporter:
            EnabledInBroker: true
          NodeExporter:
            EnabledInBroker: true
      StorageMode: LOCAL
      Tags:
        Project: CyberCommandCenter
        Plane: receiver
        Environment: !Ref EnvironmentName

  # ── CloudWatch Log Group ─────────────────────────────────────────────────────
  MSKLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/msk/ccc-${EnvironmentName}"
      RetentionInDays: 30

  # ── Broker Endpoints Secret ──────────────────────────────────────────────────
  MSKBrokersSecret:
    Type: AWS::SecretsManager::Secret
    Properties:
      Name: !Sub "ccc/shared/kafka-brokers-${EnvironmentName}"
      Description: "CCC MSK Kafka TLS broker endpoint list"
      SecretString: !Sub |
        {
          "bootstrap_servers_tls": "${MSKCluster.BootstrapBrokerStringTls}",
          "bootstrap_servers_iam": "${MSKCluster.BootstrapBrokerStringSaslIam}",
          "cluster_arn": "${MSKCluster}",
          "KAFKA_BROKERS": "${MSKCluster.BootstrapBrokerStringTls}"
        }
      Tags:
        - Key: Project
          Value: CyberCommandCenter

  # ── CloudWatch Alarms ────────────────────────────────────────────────────────
  AlarmUnderReplicatedPartitions:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ccc-msk-${EnvironmentName}-under-replicated-partitions"
      AlarmDescription: MSK has under-replicated partitions (data loss risk)
      Namespace: AWS/Kafka
      MetricName: UnderReplicatedPartitions
      Dimensions:
        - Name: Cluster Name
          Value: !Sub "ccc-msk-${EnvironmentName}"
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 2
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  AlarmDiskUsage:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ccc-msk-${EnvironmentName}-disk-usage"
      AlarmDescription: MSK broker disk usage above 80%
      Namespace: AWS/Kafka
      MetricName: KafkaDataLogsDiskUsed
      Dimensions:
        - Name: Cluster Name
          Value: !Sub "ccc-msk-${EnvironmentName}"
      Statistic: Maximum
      Period: 300
      EvaluationPeriods: 2
      Threshold: 80
      ComparisonOperator: GreaterThanThreshold

  AlarmOfflinePartitions:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmName: !Sub "ccc-msk-${EnvironmentName}-offline-partitions"
      AlarmDescription: MSK has offline partitions - cluster degraded
      Namespace: AWS/Kafka
      MetricName: OfflinePartitionsCount
      Dimensions:
        - Name: Cluster Name
          Value: !Sub "ccc-msk-${EnvironmentName}"
      Statistic: Sum
      Period: 60
      EvaluationPeriods: 1
      Threshold: 0
      ComparisonOperator: GreaterThanThreshold

  # ── MSK Storage Auto-Scaling (Application Auto Scaling on EBS per broker) ────
  # ResourceId format for MSK broker storage: cluster/{ClusterName}/broker
  # Uses the actual cluster NAME (not ARN). Ref: MSKCluster returns ARN, so we
  # use the deterministic name pattern directly via Sub.
  # ScalableDimension for MSK broker storage is kafka:broker:VolumeSize.
  # MaxCapacity wired to the BrokerScalingMaxGB parameter (default 2000 GB).
  MSKStorageScalingTarget:
    Type: AWS::ApplicationAutoScaling::ScalableTarget
    DependsOn: MSKCluster
    Properties:
      MinCapacity: !Ref BrokerStorageGB
      MaxCapacity: !Ref BrokerScalingMaxGB
      ResourceId: !Sub "cluster/ccc-msk-${EnvironmentName}/broker"
      ScalableDimension: "kafka:broker:VolumeSize"
      ServiceNamespace: kafka

  MSKStorageScalingPolicy:
    Type: AWS::ApplicationAutoScaling::ScalingPolicy
    Properties:
      PolicyName: !Sub "ccc-msk-${EnvironmentName}-storage-scaling"
      PolicyType: TargetTrackingScaling
      ScalingTargetId: !Ref MSKStorageScalingTarget
      TargetTrackingScalingPolicyConfiguration:
        PredefinedMetricSpecification:
          PredefinedMetricType: KafkaBrokerStorageUtilization
        TargetValue: 70
        ScaleInCooldown: 600
        ScaleOutCooldown: 60
        DisableScaleIn: true

Outputs:

  MSKClusterArn:
    Value: !Ref MSKCluster
    Export:
      Name: !Sub "${AWS::StackName}-ClusterArn"

  BootstrapBrokersTLS:
    Description: TLS broker endpoint list (use in app secrets)
    Value: !GetAtt MSKCluster.BootstrapBrokerStringTls
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapBrokersTLS"

  BootstrapBrokersIAM:
    Description: IAM SASL broker endpoint list
    Value: !GetAtt MSKCluster.BootstrapBrokerStringSaslIam
    Export:
      Name: !Sub "${AWS::StackName}-BootstrapBrokersIAM"

  MSKBrokersSecretArn:
    Description: Secrets Manager ARN with KAFKA_BROKERS connection string
    Value: !Ref MSKBrokersSecret
    Export:
      Name: !Sub "${AWS::StackName}-MSKBrokersSecretArn"

  ZookeeperConnectString:
    Description: ZooKeeper connect string (internal admin use only)
    Value: !GetAtt MSKCluster.ZookeeperConnectString
    Export:
      Name: !Sub "${AWS::StackName}-ZookeeperConnectString"
