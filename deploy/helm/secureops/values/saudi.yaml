global:
  storageClass: "gp3"
  dataResidency:
    country: SA
    label: saudi
    complianceFramework: NCA-PDPL

cloudProvider: "aws"

cloudProviderConfig:
  name: AWS
  zones:
    - me-central-1a
    - me-central-1b
    - me-central-1c

receiver:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 10
  pdb:
    enabled: true
    minAvailable: 1
  ingress:
    host: sa-ingest.secureops.io
    tls:
      secretName: secureops-sa-receiver-tls
  config:
    region: saudi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - me-central-1a
                  - me-central-1b
                  - me-central-1c

management:
  enabled: false

dataPlane:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 6
  pdb:
    enabled: true
    minAvailable: 1
  config:
    region: saudi
    objectStorageBucket: secureops-events-saudi
    objectStorageRegion: me-central-1

collector:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 6
  pdb:
    enabled: true
    minAvailable: 1

normalizer:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    minAvailable: 1

detectionEngine:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 6
  pdb:
    enabled: true
    minAvailable: 1

enrichment:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 4
  pdb:
    enabled: true
    minAvailable: 1

storage:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 4
  pdb:
    enabled: true
    minAvailable: 1

kafka:
  enabled: false

kafkaKraft:
  enabled: true
  replicaCount: 3
  numPartitions: 12
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  persistence:
    size: 50Gi
  pdb:
    enabled: true
    minAvailable: 2

objectStorage:
  provider: s3
  bucket: secureops-events-saudi
  region: me-central-1
  storageClass: STANDARD
  archiveStorageClass: GLACIER
