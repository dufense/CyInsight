global:
  storageClass: "gp3"
  dataResidency:
    country: US
    label: us-east
    complianceFramework: SOC2-HIPAA

cloudProvider: "aws"

cloudProviderConfig:
  name: AWS
  zones:
    - us-east-1a
    - us-east-1b
    - us-east-1c

receiver:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 20
  pdb:
    enabled: true
    minAvailable: 1
  ingress:
    host: us-ingest.secureops.io
    tls:
      secretName: secureops-us-receiver-tls
  config:
    region: us-east
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - us-east-1a
                  - us-east-1b
                  - us-east-1c

management:
  enabled: false

dataPlane:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 10
  pdb:
    enabled: true
    minAvailable: 1
  config:
    region: us-east
    objectStorageBucket: secureops-events-us-east
    objectStorageRegion: us-east-1

collector:
  replicaCount: 3
  hpa:
    minReplicas: 2
    maxReplicas: 10
  pdb:
    enabled: true
    minAvailable: 1

normalizer:
  replicaCount: 3
  hpa:
    minReplicas: 2
    maxReplicas: 15
  pdb:
    enabled: true
    minAvailable: 1

detectionEngine:
  replicaCount: 3
  hpa:
    minReplicas: 2
    maxReplicas: 10
  pdb:
    enabled: true
    minAvailable: 1

enrichment:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    minAvailable: 1

storage:
  replicaCount: 3
  hpa:
    minReplicas: 2
    maxReplicas: 6
  pdb:
    enabled: true
    minAvailable: 1

kafka:
  enabled: false

kafkaKraft:
  enabled: true
  replicaCount: 3
  numPartitions: 24
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  persistence:
    size: 100Gi
  pdb:
    enabled: true
    minAvailable: 2

objectStorage:
  provider: s3
  bucket: secureops-events-us-east
  region: us-east-1
  storageClass: STANDARD
  archiveStorageClass: GLACIER
