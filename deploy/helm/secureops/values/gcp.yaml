cloudProvider: "gcp"

cloudProviderConfig:
  name: GCP
  zones:
    - us-central1-a
    - us-central1-b
    - us-central1-c
  projectId: ""

global:
  storageClass: "standard-rwo"
  dataResidency:
    country: US
    label: gcp
    complianceFramework: SOC2

serviceAccount:
  create: true
  annotations:
    iam.gke.io/gcp-service-account: ""

objectStorage:
  provider: gcs
  bucket: secureops-events
  region: us-central1
  endpoint: ""
  projectId: ""
  keyFilePath: ""
  storageClass: STANDARD
  archiveStorageClass: ARCHIVE

ingress:
  className: gce
  annotations:
    kubernetes.io/ingress.class: gce
    kubernetes.io/ingress.global-static-ip-name: secureops-ip
    networking.gke.io/managed-certificates: secureops-cert
    networking.gke.io/v1beta1.FrontendConfig: secureops-frontend-config

receiver:
  replicaCount: 2
  ingress:
    enabled: true
    className: gce
    host: ingest.secureops.io
    annotations:
      kubernetes.io/ingress.class: gce
      kubernetes.io/ingress.global-static-ip-name: secureops-receiver-ip
      networking.gke.io/managed-certificates: secureops-receiver-cert
    tls:
      enabled: true
      secretName: secureops-receiver-tls
  service:
    type: ClusterIP
    annotations:
      cloud.google.com/neg: '{"ingress": true}'

management:
  enabled: true
  ingress:
    enabled: true
    className: gce
    host: app.secureops.io
    annotations:
      kubernetes.io/ingress.class: gce
      kubernetes.io/ingress.global-static-ip-name: secureops-management-ip
      networking.gke.io/managed-certificates: secureops-management-cert
      cloud.google.com/backend-config: '{"default": "secureops-backend-config"}'
    tls:
      enabled: true
      secretName: secureops-management-tls
  database:
    host: ""
    port: 5432
    name: secureops_management
    existingSecret: secureops-secrets
    secretKey: database-url
    ssl: true
    sslMode: require
    cloudSqlProxy:
      enabled: true
      instanceConnectionName: ""

dataPlane:
  persistence:
    enabled: true
    hotStorage:
      size: 100Gi
      storageClass: standard-rwo
    coldStorage:
      size: 500Gi
      storageClass: standard-rwo

kafka:
  enabled: false

kafkaKraft:
  enabled: false

kafkaExternal:
  enabled: true
  brokers: ""
  securityProtocol: SASL_SSL
  saslMechanism: PLAIN
  saslJaasConfig: ""
  sslEnabled: true

redis:
  enabled: true
  architecture: replicaset
  sentinel:
    enabled: true
  auth:
    enabled: true

opensearch:
  enabled: true
  replicas: 2

secrets:
  create: true
  databaseUrl: ""
  sessionSecret: ""
  aiApiKey: ""
  superadminPassword: ""
  cloudStorage:
    projectId: ""
    keyFilePath: ""

certManager:
  enabled: false

networkPolicies:
  enabled: true
