global:
  storageClass: "gp3"
  dataResidency:
    country: IN
    label: india
    complianceFramework: IT-Act-2000

cloudProvider: "aws"

cloudProviderConfig:
  name: AWS
  zones:
    - ap-south-1a
    - ap-south-1b
    - ap-south-1c

receiver:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 15
  pdb:
    enabled: true
    minAvailable: 1
  ingress:
    host: in-ingest.secureops.io
    tls:
      secretName: secureops-in-receiver-tls
  config:
    region: india
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - ap-south-1a
                  - ap-south-1b
                  - ap-south-1c

management:
  enabled: false

dataPlane:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    minAvailable: 1
  config:
    region: india
    objectStorageBucket: secureops-events-india
    objectStorageRegion: ap-south-1

collector:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    minAvailable: 1

normalizer:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 10
  pdb:
    enabled: true
    minAvailable: 1

detectionEngine:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 8
  pdb:
    enabled: true
    minAvailable: 1

enrichment:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 6
  pdb:
    enabled: true
    minAvailable: 1

storage:
  replicaCount: 2
  hpa:
    minReplicas: 2
    maxReplicas: 5
  pdb:
    enabled: true
    minAvailable: 1

kafka:
  enabled: false

kafkaKraft:
  enabled: true
  replicaCount: 3
  numPartitions: 12
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  persistence:
    size: 50Gi
  pdb:
    enabled: true
    minAvailable: 2

objectStorage:
  provider: s3
  bucket: secureops-events-india
  region: ap-south-1
  storageClass: STANDARD
  archiveStorageClass: GLACIER
