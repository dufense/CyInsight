{{- if .Values.dataPlane.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureops.fullname" . }}-data-plane
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    plane: data
spec:
  replicas: {{ .Values.dataPlane.replicaCount }}
  selector:
    matchLabels:
      {{- include "secureops.selectorLabels" . | nindent 6 }}
      plane: data
  template:
    metadata:
      labels:
        {{- include "secureops.selectorLabels" . | nindent 8 }}
        plane: data
    spec:
      {{- include "secureops.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "secureops.fullname" . }}-data-plane
      {{- end }}
      containers:
        - name: data-plane
          image: "{{ .Values.global.imageRegistry }}{{ .Values.dataPlane.image.repository }}:{{ .Values.dataPlane.image.tag }}"
          imagePullPolicy: {{ .Values.dataPlane.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: PLANE
              value: "data"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureops.secretName" . }}
                  key: timescaledb-url
            - name: REGION
              value: {{ .Values.dataPlane.config.region }}
            {{- include "secureops.kafkaEnv" . | nindent 12 }}
            {{- include "secureops.objectStorageEnv" . | nindent 12 }}
            {{- include "secureops.sslEnv" . | nindent 12 }}
          resources:
            {{- toYaml .Values.dataPlane.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          {{- if .Values.dataPlane.persistence.enabled }}
          volumeMounts:
            - name: hot-storage
              mountPath: /app/data
          {{- end }}
      {{- if .Values.dataPlane.persistence.enabled }}
      volumes:
        - name: hot-storage
          persistentVolumeClaim:
            claimName: {{ include "secureops.fullname" . }}-data-plane-hot
      {{- end }}
{{- end }}
