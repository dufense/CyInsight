    {{- include "secureops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      plane: management
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - ports:
        - port: 5000
  egress:
    - to:
        - podSelector:
            matchLabels:
              component: kafka
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              component: redis
      ports:
        - port: 6379
    - to:
        - podSelector:
            matchLabels:
              component: collector
      ports:
        - port: 5000
    - to:
        - podSelector:
            matchLabels:
              component: normalizer
      ports:
        - port: 5000
    - to:
        - podSelector:
            matchLabels:
              component: detection-engine
      ports:
        - port: 5000
    - to:
        - podSelector:
            matchLabels:
              component: enrichment
      ports:
        - port: 5000
    - to:
        - podSelector:
            matchLabels:
              component: storage
      ports:
        - port: 5000
    - to: []
      ports:
        - port: 5432
        - port: 443
{{- end }}
