{{- if .Values.networkPolicies.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "secureops.fullname" . }}-collector
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      component: collector
  policyTypes:
    - Ingress
    - Egress
  ingress:
    - from:
        - podSelector:
            matchLabels:
              plane: management
      ports:
        - port: 5000
    - ports:
        - port: 514
          protocol: UDP
        - port: 1514
        - port: 6514
  egress:
    - to:
        - podSelector:
            matchLabels:
              component: kafka
      ports:
        - port: 9092
    - to:
        - podSelector:
            matchLabels:
              component: redis
      ports:
        - port: 6379
    - to: []
      ports:
        - port: 443
        - port: 80
---
