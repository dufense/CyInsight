{{- if .Values.receiver.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureops.fullname" . }}-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    plane: receiver
spec:
  replicas: {{ .Values.receiver.replicaCount }}
  selector:
    matchLabels:
      {{- include "secureops.selectorLabels" . | nindent 6 }}
      plane: receiver
  template:
    metadata:
      labels:
        {{- include "secureops.selectorLabels" . | nindent 8 }}
        plane: receiver
    spec:
      {{- include "secureops.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "secureops.fullname" . }}-receiver
      {{- end }}
      containers:
        - name: receiver
          image: "{{ .Values.global.imageRegistry }}{{ .Values.receiver.image.repository }}:{{ .Values.receiver.image.tag }}"
          imagePullPolicy: {{ .Values.receiver.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
            {{- if .Values.receiver.syslog.enabled }}
            - name: syslog-udp
              containerPort: {{ .Values.receiver.syslog.udpPort }}
              protocol: UDP
            - name: syslog-tcp
              containerPort: {{ .Values.receiver.syslog.tcpPort }}
            - name: syslog-tls
              containerPort: {{ .Values.receiver.syslog.tlsPort }}
            {{- end }}
          env:
            - name: PLANE
              value: "receiver"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            {{- include "secureops.kafkaEnv" . | nindent 12 }}
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureops.secretName" . }}
                  key: openai-api-key
          resources:
            {{- toYaml .Values.receiver.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          volumeMounts:
            - name: sigma-rules
              mountPath: /app/sigma-rules
              readOnly: true
      volumes:
        - name: sigma-rules
          configMap:
            name: {{ include "secureops.fullname" . }}-sigma-rules
{{- end }}
