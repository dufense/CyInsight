{{- if .Values.secrets.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "secureops.fullname" . }}-secrets
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
type: Opaque
data:
  {{- if .Values.secrets.databaseUrl }}
  database-url: {{ .Values.secrets.databaseUrl | b64enc | quote }}
  {{- else }}
  database-url: {{ printf "postgresql://secureops:changeme@localhost:5432/secureops_management" | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.timescaledbUrl }}
  timescaledb-url: {{ .Values.secrets.timescaledbUrl | b64enc | quote }}
  {{- else }}
  timescaledb-url: {{ printf "postgresql://secureops:changeme@localhost:5432/secureops_data" | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.sessionSecret }}
  session-secret: {{ .Values.secrets.sessionSecret | b64enc | quote }}
  {{- else }}
  session-secret: {{ randAlphaNum 64 | b64enc | quote }}
  {{- end }}
  {{- $aiKey := .Values.secrets.openaiApiKey | default .Values.secrets.aiApiKey | default "" }}
  {{- if $aiKey }}
  openai-api-key: {{ $aiKey | b64enc | quote }}
  {{- else }}
  openai-api-key: {{ printf "" | b64enc | quote }}
  {{- end }}
  {{- if .Values.secrets.superadminPassword }}
  superadmin-password: {{ .Values.secrets.superadminPassword | b64enc | quote }}
  {{- else }}
  superadmin-password: {{ randAlphaNum 32 | b64enc | quote }}
  {{- end }}
  {{- $csAccessKey := .Values.secrets.cloudStorageAccessKey | default (dig "cloudStorage" "accessKeyId" "" .Values.secrets) | default "" }}
  {{- if $csAccessKey }}
  cloud-storage-access-key: {{ $csAccessKey | b64enc | quote }}
  {{- end }}
  {{- $csSecretKey := .Values.secrets.cloudStorageSecretKey | default (dig "cloudStorage" "secretAccessKey" "" .Values.secrets) | default "" }}
  {{- if $csSecretKey }}
  cloud-storage-secret-key: {{ $csSecretKey | b64enc | quote }}
  {{- end }}
  {{- if and .Values.kafkaExternal .Values.kafkaExternal.enabled .Values.kafkaExternal.saslJaasConfig }}
  kafka-sasl-jaas-config: {{ .Values.kafkaExternal.saslJaasConfig | b64enc | quote }}
  {{- end }}
{{- end }}
