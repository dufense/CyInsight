{{- if .Values.management.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureops.fullname" . }}-management
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    plane: management
  {{- if eq .Values.cloudProvider "aws" }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internal
  {{- else if eq .Values.cloudProvider "azure" }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "true"
  {{- else if eq .Values.cloudProvider "gcp" }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
  {{- end }}
spec:
  type: {{ .Values.management.service.type }}
  ports:
    - name: http
      port: {{ .Values.management.service.port }}
      targetPort: http
  selector:
    {{- include "secureops.selectorLabels" . | nindent 4 }}
    plane: management
{{- end }}
