{{- if .Values.storage.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureops.fullname" . }}-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    component: storage
spec:
  replicas: {{ .Values.storage.replicaCount }}
  selector:
    matchLabels:
      {{- include "secureops.selectorLabels" . | nindent 6 }}
      component: storage
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "secureops.selectorLabels" . | nindent 8 }}
        component: storage
    spec:
      {{- include "secureops.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "secureops.fullname" . }}-storage
      {{- end }}
      containers:
        - name: storage
          image: "{{ .Values.global.imageRegistry }}{{ .Values.storage.image.repository }}:{{ .Values.storage.image.tag }}"
          imagePullPolicy: {{ .Values.storage.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SERVICE_NAME
              value: "storage"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            {{- include "secureops.kafkaEnv" . | nindent 12 }}
            - name: REDIS_URL
              value: redis://{{ include "secureops.fullname" . }}-redis:6379
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureops.secretName" . }}
                  key: timescaledb-url
            - name: OPENSEARCH_URL
              value: http://{{ include "secureops.fullname" . }}-opensearch:9200
            {{- include "secureops.objectStorageEnv" . | nindent 12 }}
          envFrom:
            - configMapRef:
                name: {{ include "secureops.fullname" . }}-storage
          resources:
            {{- toYaml .Values.storage.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
