{{- if .Values.enrichment.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureops.fullname" . }}-enrichment
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    component: enrichment
spec:
  replicas: {{ .Values.enrichment.replicaCount }}
  selector:
    matchLabels:
      {{- include "secureops.selectorLabels" . | nindent 6 }}
      component: enrichment
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "secureops.selectorLabels" . | nindent 8 }}
        component: enrichment
    spec:
      {{- include "secureops.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "secureops.fullname" . }}-enrichment
      {{- end }}
      containers:
        - name: enrichment
          image: "{{ .Values.global.imageRegistry }}{{ .Values.enrichment.image.repository }}:{{ .Values.enrichment.image.tag }}"
          imagePullPolicy: {{ .Values.enrichment.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SERVICE_NAME
              value: "enrichment"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            {{- include "secureops.kafkaEnv" . | nindent 12 }}
            - name: REDIS_URL
              value: redis://{{ include "secureops.fullname" . }}-redis:6379
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: {{ include "secureops.secretName" . }}
                  key: openai-api-key
          envFrom:
            - configMapRef:
                name: {{ include "secureops.fullname" . }}-enrichment
          resources:
            {{- toYaml .Values.enrichment.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
{{- end }}
