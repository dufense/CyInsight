{{- if .Values.storage.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureops.fullname" . }}-storage
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    component: storage
spec:
  type: {{ .Values.storage.service.type }}
  ports:
    - name: http
      port: {{ .Values.storage.service.port }}
      targetPort: http
  selector:
    {{- include "secureops.selectorLabels" . | nindent 4 }}
    component: storage
{{- end }}
