{{- if and .Values.receiver.enabled (default true .Values.receiver.pdb.enabled) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "secureops.fullname" . }}-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    component: receiver
spec:
  minAvailable: {{ .Values.receiver.pdb.minAvailable | default 1 }}
  selector:
    matchLabels:
      {{- include "secureops.selectorLabels" . | nindent 6 }}
      component: receiver
---
{{- end }}
