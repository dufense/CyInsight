{{- if .Values.detectionEngine.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "secureops.fullname" . }}-detection-engine
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    component: detection-engine
spec:
  replicas: {{ .Values.detectionEngine.replicaCount }}
  selector:
    matchLabels:
      {{- include "secureops.selectorLabels" . | nindent 6 }}
      component: detection-engine
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        {{- include "secureops.selectorLabels" . | nindent 8 }}
        component: detection-engine
    spec:
      {{- include "secureops.imagePullSecrets" . | nindent 6 }}
      {{- if .Values.serviceAccount.create }}
      serviceAccountName: {{ include "secureops.fullname" . }}-detection-engine
      {{- end }}
      containers:
        - name: detection-engine
          image: "{{ .Values.global.imageRegistry }}{{ .Values.detectionEngine.image.repository }}:{{ .Values.detectionEngine.image.tag }}"
          imagePullPolicy: {{ .Values.detectionEngine.image.pullPolicy }}
          ports:
            - name: http
              containerPort: 5000
          env:
            - name: SERVICE_NAME
              value: "detection-engine"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            {{- include "secureops.kafkaEnv" . | nindent 12 }}
            - name: REDIS_URL
              value: redis://{{ include "secureops.fullname" . }}-redis:6379
          envFrom:
            - configMapRef:
                name: {{ include "secureops.fullname" . }}-detection-engine
          resources:
            {{- toYaml .Values.detectionEngine.resources | nindent 12 }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 30
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
          volumeMounts:
            - name: sigma-rules
              mountPath: /app/sigma-rules
              readOnly: true
      volumes:
        - name: sigma-rules
          configMap:
            name: {{ include "secureops.fullname" . }}-sigma-rules
{{- end }}
