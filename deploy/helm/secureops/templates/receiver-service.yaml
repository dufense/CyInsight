{{- if .Values.receiver.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "secureops.fullname" . }}-receiver
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "secureops.labels" . | nindent 4 }}
    plane: receiver
  {{- if eq .Values.cloudProvider "aws" }}
  annotations:
    service.beta.kubernetes.io/aws-load-balancer-type: nlb
    service.beta.kubernetes.io/aws-load-balancer-scheme: internet-facing
  {{- else if eq .Values.cloudProvider "azure" }}
  annotations:
    service.beta.kubernetes.io/azure-load-balancer-internal: "false"
  {{- else if eq .Values.cloudProvider "gcp" }}
  annotations:
    cloud.google.com/neg: '{"ingress": true}'
  {{- end }}
spec:
  type: {{ .Values.receiver.service.type }}
  ports:
    - name: http
      port: {{ .Values.receiver.service.port }}
      targetPort: http
  selector:
    {{- include "secureops.selectorLabels" . | nindent 4 }}
    plane: receiver
{{- end }}
