global:
  region: me-central-1
  checkpointRegion: me
  storageClass: gp3
  dataResidency:
    country: SA
    label: saudi
    complianceFramework: NCA-PDPL

cloudProvider: "aws"

cloudProviderConfig:
  name: AWS
  zones:
    - me-central-1a
    - me-central-1b
    - me-central-1c

objectStorage:
  provider: s3
  bucket: secureops-events-saudi
  region: me-central-1
  storageClass: STANDARD
  archiveStorageClass: GLACIER

database:
  replication:
    enabled: true
    mode: streaming
    replicas: 2

collector:
  replicaCount: 2
  resources:
    requests:
      cpu: 500m
      memory: 512Mi
    limits:
      cpu: 1500m
      memory: 1Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - me-central-1a
                  - me-central-1b
                  - me-central-1c

normalizer:
  replicaCount: 2

detectionEngine:
  replicaCount: 2

enrichment:
  replicaCount: 2

storage:
  replicaCount: 2

kafkaKraft:
  enabled: true
  replicaCount: 3
  numPartitions: 12
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  persistence:
    size: 50Gi
  pdb:
    enabled: true
    minAvailable: 2
