global:
  region: us-east-1
  checkpointRegion: us
  storageClass: gp3
  dataResidency:
    country: US
    label: us-east
    complianceFramework: SOC2-HIPAA

cloudProvider: "aws"

cloudProviderConfig:
  name: AWS
  zones:
    - us-east-1a
    - us-east-1b
    - us-east-1c

objectStorage:
  provider: s3
  bucket: secureops-events-us-east
  region: us-east-1
  storageClass: STANDARD
  archiveStorageClass: GLACIER

database:
  replication:
    enabled: true
    mode: streaming
    replicas: 2

collector:
  replicaCount: 3
  resources:
    requests:
      cpu: 1000m
      memory: 1Gi
    limits:
      cpu: 2000m
      memory: 2Gi
  affinity:
    nodeAffinity:
      requiredDuringSchedulingIgnoredDuringExecution:
        nodeSelectorTerms:
          - matchExpressions:
              - key: topology.kubernetes.io/zone
                operator: In
                values:
                  - us-east-1a
                  - us-east-1b
                  - us-east-1c

normalizer:
  replicaCount: 3

detectionEngine:
  replicaCount: 3

enrichment:
  replicaCount: 2

storage:
  replicaCount: 3

kafkaKraft:
  enabled: true
  replicaCount: 3
  numPartitions: 24
  defaultReplicationFactor: 3
  minInsyncReplicas: 2
  persistence:
    size: 100Gi
  pdb:
    enabled: true
    minAvailable: 2
