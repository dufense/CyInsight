apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-management
  namespace: secureops
  labels:
    app: secureops
    plane: management
spec:
  replicas: 3
  selector:
    matchLabels:
      app: secureops
      plane: management
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: secureops
        plane: management
    spec:
      serviceAccountName: secureops-management
      containers:
        - name: management
          image: secureops/management:latest
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: PLANE
              value: "management"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: database-url
            - name: SESSION_SECRET
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: session-secret
            - name: OPENAI_API_KEY
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: openai-api-key
            - name: SUPERADMIN_DEFAULT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: superadmin-password
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: secureops-management-config
                  key: kafka-brokers
            - name: REDIS_URL
              valueFrom:
                configMapKeyRef:
                  name: secureops-management-config
                  key: redis-url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
          volumeMounts:
            - name: app-data
              mountPath: /app/data
      volumes:
        - name: app-data
          persistentVolumeClaim:
            claimName: secureops-management-data
