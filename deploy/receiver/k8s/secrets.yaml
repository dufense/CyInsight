apiVersion: v1
kind: Secret
metadata:
  name: secureops-secrets
  namespace: secureops
  labels:
    app: secureops
  annotations:
    # This secret is shared across all planes in the secureops namespace.
    # For production, use an external secrets manager:
    # --- AWS Secrets Manager (via External Secrets Operator) ---
    # externalsecrets.io/provider: "aws-secretsmanager"
    # --- Azure Key Vault (via External Secrets Operator) ---
    # externalsecrets.io/provider: "azure-keyvault"
    # --- GCP Secret Manager (via External Secrets Operator) ---
    # externalsecrets.io/provider: "gcp-secretmanager"
type: Opaque
stringData:
  openai-api-key: "REPLACE_WITH_ACTUAL_KEY"
  database-url: "REPLACE_WITH_ACTUAL_URL"
  timescaledb-url: "REPLACE_WITH_ACTUAL_URL"
  session-secret: "REPLACE_WITH_ACTUAL_SECRET"
  superadmin-password: "REPLACE_WITH_ACTUAL_PASSWORD"
