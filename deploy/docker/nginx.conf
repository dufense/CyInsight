##############################################################################
# Cyber Command Center — Production Nginx Load Balancer Config
# For: docker-compose.prod.yml (VMware / Nutanix / Bare-metal Docker)
#
# This nginx acts as:
#   1. Reverse proxy / load balancer across management replicas
#   2. TLS termination point (place certs in ./certs/ volume)
#   3. HTTP -> HTTPS redirect
#   4. Static file caching for the React SPA
##############################################################################

worker_processes auto;
worker_rlimit_nofile 65535;
pid /tmp/nginx.pid;

events {
    worker_connections 4096;
    multi_accept on;
    use epoll;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;

    sendfile           on;
    tcp_nopush         on;
    tcp_nodelay        on;
    keepalive_timeout  75;
    keepalive_requests 1000;
    types_hash_max_size 2048;
    server_tokens off;

    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 6;
    gzip_min_length 1024;
    gzip_types
        application/javascript
        application/json
        application/xml
        image/svg+xml
        text/css
        text/html
        text/javascript
        text/plain
        text/xml;

    log_format json_access escape=json
        '{"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"method":"$request_method",'
        '"uri":"$request_uri",'
        '"status":$status,'
        '"bytes":$body_bytes_sent,'
        '"duration":$request_time,'
        '"upstream_addr":"$upstream_addr",'
        '"upstream_duration":"$upstream_response_time",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"}';

    access_log /dev/stdout json_access;
    error_log  /dev/stderr warn;

    # --- Rate Limiting Zones -------------------------------------------------
    limit_req_zone $binary_remote_addr zone=login:10m rate=5r/m;
    limit_req_zone $binary_remote_addr zone=api:20m rate=60r/s;
    limit_req_zone $binary_remote_addr zone=ingest:10m rate=1000r/s;
    limit_conn_zone $binary_remote_addr zone=conn_limit:10m;

    # --- Upstream: Management Plane ------------------------------------------
    upstream management_backend {
        least_conn;
        server management:5000 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 64;
    }

    # --- Upstream: Receiver (Event Ingest) -----------------------------------
    upstream receiver_backend {
        least_conn;
        server receiver:5001 weight=1 max_fails=3 fail_timeout=30s;
        keepalive 32;
    }

    # --- Map: Upgrade header for WebSocket -----------------------------------
    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    # --- HTTP -> HTTPS Redirect ----------------------------------------------
    server {
        listen 80;
        server_name _;

        location /.well-known/acme-challenge/ {
            root /var/www/certbot;
        }

        location / {
            return 301 https://$host$request_uri;
        }
    }

    # --- HTTPS: Management Plane (UI + API) ----------------------------------
    server {
        listen 443 ssl http2;
        server_name _;

        # TLS
        ssl_certificate     /etc/nginx/certs/fullchain.pem;
        ssl_certificate_key /etc/nginx/certs/privkey.pem;
        ssl_protocols       TLSv1.2 TLSv1.3;
        ssl_ciphers         'TLS_AES_128_GCM_SHA256:TLS_AES_256_GCM_SHA384:TLS_CHACHA20_POLY1305_SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-RSA-AES256-GCM-SHA384';
        ssl_prefer_server_ciphers off;
        ssl_session_cache   shared:SSL:20m;
        ssl_session_timeout 4h;
        ssl_session_tickets off;
        ssl_stapling        on;
        ssl_stapling_verify on;

        # Security headers (defense-in-depth — also set by Helmet in Node)
        add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
        add_header X-Frame-Options "DENY" always;
        add_header X-Content-Type-Options "nosniff" always;
        add_header Referrer-Policy "strict-origin-when-cross-origin" always;
        add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

        # Connection limit per IP
        limit_conn conn_limit 100;

        # Client body size
        client_max_body_size 100m;

        # Proxy timeouts
        proxy_connect_timeout 60s;
        proxy_send_timeout    300s;
        proxy_read_timeout    300s;

        # WebSocket support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Buffering
        proxy_buffering         on;
        proxy_buffer_size       16k;
        proxy_buffers           8 16k;
        proxy_busy_buffers_size 32k;

        # Auth endpoint — strict rate limiting
        location /api/auth/login {
            limit_req zone=login burst=5 nodelay;
            limit_req_status 429;
            proxy_pass http://management_backend;
        }

        # API endpoints — standard rate limiting
        location /api/ {
            limit_req zone=api burst=200 nodelay;
            limit_req_status 429;
            proxy_pass http://management_backend;
        }

        # Static assets — aggressive caching
        location /assets/ {
            proxy_pass http://management_backend;
            proxy_cache_valid 200 30d;
            add_header Cache-Control "public, max-age=2592000, immutable";
            expires 30d;
        }

        # Health endpoint — no rate limit, no auth
        location /healthz {
            proxy_pass http://management_backend;
            access_log off;
        }

        # Default — SPA
        location / {
            proxy_pass http://management_backend;
            proxy_intercept_errors on;
            error_page 502 503 504 = @maintenance;
        }

        location @maintenance {
            return 503 '{"error":"Service temporarily unavailable. Please try again in a moment."}';
            add_header Content-Type application/json;
        }
    }
}
