# Cyber Command Center — Redis Sentinel Configuration
# For: docker-compose.prod.yml
#
# Sentinel monitors the redis-primary and will promote redis-replica-1
# if the primary is unreachable for more than 5 seconds (quorum: 1 in single-DC).

sentinel monitor ccc-primary redis-primary 6379 1
sentinel down-after-milliseconds ccc-primary 5000
sentinel failover-timeout ccc-primary 60000
sentinel parallel-syncs ccc-primary 1

# Auth (uncomment if REDIS_PASSWORD is set)
# sentinel auth-pass ccc-primary YOUR_REDIS_PASSWORD

# Prevent sentinel from modifying this file on its own
# (mounted read-only in compose)
