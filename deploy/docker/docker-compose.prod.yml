##############################################################################
# Cyber Command Center — Production Docker Compose
#
# For VMware vSphere VMs, Nutanix AHV VMs, or any bare-metal/VM environment
# running Docker Engine 24+ and Docker Compose v2.
#
# Features:
#   - CPU/memory resource limits and reservations on all services
#   - Health checks with restart policies for zero-downtime auto-recovery
#   - Horizontal scale hints (use `docker compose up --scale` or Swarm)
#   - Named volumes for persistent data
#   - Isolated internal network with no unnecessary port exposure
#   - Redis Sentinel for HA session store
#   - Kafka KRaft cluster (3-node) for event streaming
#
# Usage:
#   cp deploy/docker/.env.onprem .env.prod   # copy and edit secrets
#   docker compose -f deploy/docker/docker-compose.prod.yml \
#     --env-file .env.prod up -d
#
#   # Scale management plane horizontally (behind nginx)
#   docker compose -f deploy/docker/docker-compose.prod.yml \
#     --env-file .env.prod up -d --scale management=3
##############################################################################

version: "3.9"

x-logging: &default-logging
  driver: json-file
  options:
    max-size: "50m"
    max-file: "5"

x-restart: &always-restart
  restart: always

x-management-env: &management-env
  NODE_ENV: production
  PORT: "5000"
  DATABASE_URL: ${MANAGEMENT_DATABASE_URL}
  SESSION_SECRET: ${SESSION_SECRET}
  OPENAI_API_KEY: ${AI_API_KEY:-}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  AI_MODEL: ${AI_MODEL:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  SUPERADMIN_DEFAULT_PASSWORD: ${SUPERADMIN_DEFAULT_PASSWORD}
  REDIS_URL: redis://:${REDIS_PASSWORD:-}@redis-primary:6379
  PLANE: management

services:

  # ── Load Balancer ───────────────────────────────────────────────────────────
  nginx:
    image: nginx:1.27-alpine
    <<: *always-restart
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./certs:/etc/nginx/certs:ro
    depends_on:
      - management
    networks:
      - ccc-internal
    healthcheck:
      test: ["CMD", "nginx", "-t"]
      interval: 30s
      timeout: 10s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M
    logging: *default-logging

  # ── Management Plane ────────────────────────────────────────────────────────
  management:
    image: ${MANAGEMENT_IMAGE:-ccc/management:latest}
    build:
      context: ../..
      dockerfile: deploy/management/Dockerfile
    <<: *always-restart
    expose:
      - "5000"
    environment:
      <<: *management-env
    depends_on:
      management-db:
        condition: service_healthy
      redis-primary:
        condition: service_healthy
    networks:
      - ccc-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5000/healthz"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      replicas: 3
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G
      update_config:
        parallelism: 1
        delay: 30s
        failure_action: rollback
        order: start-first
      restart_policy:
        condition: any
        delay: 10s
        max_attempts: 5
        window: 120s
    logging: *default-logging

  # ── Receiver (Event Ingest) ──────────────────────────────────────────────────
  receiver:
    image: ${RECEIVER_IMAGE:-ccc/receiver:latest}
    build:
      context: ../..
      dockerfile: deploy/receiver/Dockerfile
    <<: *always-restart
    ports:
      - "${RECEIVER_PORT:-5001}:5001"
      - "514:514/udp"
      - "1514:1514/tcp"
    environment:
      NODE_ENV: production
      PORT: "5001"
      KAFKA_BROKERS: ${KAFKA_BROKERS}
      PLANE: receiver
      RATE_LIMIT_EPS: ${POLLING_CONCURRENCY:-10000}
    depends_on:
      kafka-1:
        condition: service_healthy
    networks:
      - ccc-internal
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:5001/healthz"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 30s
    deploy:
      replicas: 2
      resources:
        limits:
          cpus: "3.0"
          memory: 3G
        reservations:
          cpus: "0.5"
          memory: 512M
    logging: *default-logging

  # ── Management Database (PostgreSQL) ────────────────────────────────────────
  management-db:
    image: postgres:16-alpine
    <<: *always-restart
    environment:
      POSTGRES_USER: ${DB_USER:-secureops}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: secureops_management
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - management-db-data:/var/lib/postgresql/data
    networks:
      - ccc-internal
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureops} -d secureops_management"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 1G
    logging: *default-logging

  # ── Redis Primary ────────────────────────────────────────────────────────────
  redis-primary:
    image: redis:7.4-alpine
    <<: *always-restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy allkeys-lru
      --save 60 1000
      --appendonly yes
      --tcp-keepalive 300
    volumes:
      - redis-primary-data:/data
    networks:
      - ccc-internal
    healthcheck:
      test: ["CMD", "redis-cli", "--pass", "${REDIS_PASSWORD:-}", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.1"
          memory: 256M
    logging: *default-logging

  redis-replica-1:
    image: redis:7.4-alpine
    <<: *always-restart
    command: >
      redis-server
      --requirepass ${REDIS_PASSWORD:-}
      --replicaof redis-primary 6379
      --masterauth ${REDIS_PASSWORD:-}
      --maxmemory ${REDIS_MAXMEMORY:-1gb}
      --maxmemory-policy allkeys-lru
    volumes:
      - redis-replica-1-data:/data
    networks:
      - ccc-internal
    depends_on:
      - redis-primary
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.1"
          memory: 128M
    logging: *default-logging

  redis-sentinel-1:
    image: redis:7.4-alpine
    <<: *always-restart
    command: >
      redis-sentinel /etc/redis/sentinel.conf
    volumes:
      - ./redis-sentinel.conf:/etc/redis/sentinel.conf:ro
    networks:
      - ccc-internal
    depends_on:
      - redis-primary
      - redis-replica-1
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.05"
          memory: 64M
    logging: *default-logging

  # ── Kafka KRaft Cluster (3-node) ────────────────────────────────────────────
  kafka-1:
    image: bitnami/kafka:3.8
    <<: *always-restart
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS:-168}"
      KAFKA_CFG_LOG_RETENTION_BYTES: "${KAFKA_LOG_RETENTION_BYTES:-10737418240}"
      KAFKA_CFG_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-16}"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "ccc-prod-kafka-cluster-001"
    volumes:
      - kafka-1-data:/bitnami/kafka
    networks:
      - ccc-internal
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092 || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 60s
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 2G
    logging: *default-logging

  kafka-2:
    image: bitnami/kafka:3.8
    <<: *always-restart
    environment:
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS:-168}"
      KAFKA_CFG_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-16}"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_KRAFT_CLUSTER_ID: "ccc-prod-kafka-cluster-001"
    volumes:
      - kafka-2-data:/bitnami/kafka
    networks:
      - ccc-internal
    depends_on:
      - kafka-1
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 2G
    logging: *default-logging

  kafka-3:
    image: bitnami/kafka:3.8
    <<: *always-restart
    environment:
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CFG_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LOG_RETENTION_HOURS: "${KAFKA_LOG_RETENTION_HOURS:-168}"
      KAFKA_CFG_NUM_PARTITIONS: "${KAFKA_NUM_PARTITIONS:-16}"
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: "3"
      KAFKA_CFG_MIN_INSYNC_REPLICAS: "2"
      KAFKA_KRAFT_CLUSTER_ID: "ccc-prod-kafka-cluster-001"
    volumes:
      - kafka-3-data:/bitnami/kafka
    networks:
      - ccc-internal
    depends_on:
      - kafka-1
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 8G
        reservations:
          cpus: "0.5"
          memory: 2G
    logging: *default-logging

  # ── MinIO (Object Storage) ───────────────────────────────────────────────────
  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    <<: *always-restart
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio-data:/data
    networks:
      - ccc-internal
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 30s
      timeout: 20s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.2"
          memory: 512M
    logging: *default-logging

networks:
  ccc-internal:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  management-db-data:
    driver: local
  redis-primary-data:
    driver: local
  redis-replica-1-data:
    driver: local
  kafka-1-data:
    driver: local
  kafka-2-data:
    driver: local
  kafka-3-data:
    driver: local
  minio-data:
    driver: local
