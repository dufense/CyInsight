version: "3.9"

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-1:9092,kafka-2:9092,kafka-3:9092}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

x-management-env: &management-env
  <<: *common-env
  PLANE: management
  SERVICE_NAME: management
  DATABASE_URL: ${MANAGEMENT_DATABASE_URL:-postgresql://secureops:${DB_PASSWORD:-secureops_dev_password}@management-db:5432/secureops_management}
  SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  AI_MODEL: ${AI_MODEL:-}
  AI_API_KEY: ${AI_API_KEY:-}
  AI_BASE_URL: ${AI_BASE_URL:-}
  SUPERADMIN_DEFAULT_PASSWORD: ${SUPERADMIN_DEFAULT_PASSWORD:-Admin@123}
  CLOUD_STORAGE_PROVIDER: ${CLOUD_STORAGE_PROVIDER:-minio}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}

x-data-plane-env: &data-plane-env
  <<: *common-env
  REGION: ${DATA_PLANE_REGION:-local-1}
  REGION_NAME: ${DATA_PLANE_REGION_NAME:-On-Premises (Local)}
  MANAGEMENT_PLANE_URL: ${MANAGEMENT_PLANE_URL:-http://nginx:80}
  CLICKHOUSE_URL: ${CLICKHOUSE_URL:-http://clickhouse:8123}
  CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
  CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
  CLICKHOUSE_DATABASE: ${CLICKHOUSE_DATABASE:-ccc}

x-restart-policy: &restart-policy
  restart: unless-stopped

x-healthcheck-defaults: &healthcheck-defaults
  interval: 15s
  timeout: 10s
  retries: 5
  start_period: 30s

services:
  management-db:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      POSTGRES_DB: secureops_management
      POSTGRES_USER: ${DB_USER:-secureops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureops_dev_password}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${MGMT_DB_PORT:-5432}:5432"
    volumes:
      - management_pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c max_replication_slots=5
        -c hot_standby=on
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureops} -d secureops_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  management-db-replica:
    image: postgres:16-alpine
    <<: *restart-policy
    environment:
      POSTGRES_DB: secureops_management
      POSTGRES_USER: ${DB_USER:-secureops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureops_dev_password}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - management_pgdata_replica:/var/lib/postgresql/data
    entrypoint: >
      bash -c "
        until pg_isready -h management-db -U ${DB_USER:-secureops}; do sleep 2; done;
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          pg_basebackup -h management-db -U ${DB_USER:-secureops} -D /var/lib/postgresql/data -Fp -Xs -R -P;
        fi;
        exec postgres -c hot_standby=on
      "
    depends_on:
      management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureops} -d secureops_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  data-plane-db:
    image: timescale/timescaledb:latest-pg16
    <<: *restart-policy
    environment:
      POSTGRES_DB: secureops_events
      POSTGRES_USER: ${DB_USER:-secureops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureops_dev_password}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${DP_DB_PORT:-5433}:5432"
    volumes:
      - dataplane_pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c max_replication_slots=5
        -c hot_standby=on
        -c shared_buffers=512MB
        -c effective_cache_size=1536MB
        -c work_mem=32MB
        -c maintenance_work_mem=256MB
        -c max_connections=300
        -c shared_preload_libraries=timescaledb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureops} -d secureops_events"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "4.0"
          memory: 4G
        reservations:
          cpus: "1.0"
          memory: 1G

  data-plane-db-replica:
    image: timescale/timescaledb:latest-pg16
    <<: *restart-policy
    environment:
      POSTGRES_DB: secureops_events
      POSTGRES_USER: ${DB_USER:-secureops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureops_dev_password}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - dataplane_pgdata_replica:/var/lib/postgresql/data
    entrypoint: >
      bash -c "
        until pg_isready -h data-plane-db -U ${DB_USER:-secureops}; do sleep 2; done;
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          pg_basebackup -h data-plane-db -U ${DB_USER:-secureops} -D /var/lib/postgresql/data -Fp -Xs -R -P;
        fi;
        exec postgres -c hot_standby=on -c shared_preload_libraries=timescaledb
      "
    depends_on:
      data-plane-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureops} -d secureops_events"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  redis:
    image: redis:7-alpine
    <<: *restart-policy
    command: >
      redis-server
        --maxmemory ${REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
        --requirepass ${REDIS_PASSWORD:-}
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  redis-sentinel:
    image: redis:7-alpine
    <<: *restart-policy
    command: >
      sh -c "
        mkdir -p /etc/redis;
        echo 'port 26379' > /etc/redis/sentinel.conf;
        echo 'sentinel monitor secureops-master redis 6379 1' >> /etc/redis/sentinel.conf;
        echo 'sentinel down-after-milliseconds secureops-master 5000' >> /etc/redis/sentinel.conf;
        echo 'sentinel failover-timeout secureops-master 10000' >> /etc/redis/sentinel.conf;
        echo 'sentinel parallel-syncs secureops-master 1' >> /etc/redis/sentinel.conf;
        exec redis-sentinel /etc/redis/sentinel.conf
      "
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-1:
    image: bitnami/kafka:3.8
    <<: *restart-policy
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-1:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-12}
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_CFG_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
      KAFKA_CFG_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_CFG_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-10737418240}
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "secureops-onprem-cluster-001"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data_1:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      <<: *healthcheck-defaults
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  kafka-2:
    image: bitnami/kafka:3.8
    <<: *restart-policy
    environment:
      KAFKA_CFG_NODE_ID: "2"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-2:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-12}
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_CFG_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
      KAFKA_CFG_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_CFG_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-10737418240}
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "secureops-onprem-cluster-001"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data_2:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      <<: *healthcheck-defaults
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  kafka-3:
    image: bitnami/kafka:3.8
    <<: *restart-policy
    environment:
      KAFKA_CFG_NODE_ID: "3"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-1:9093,2@kafka-2:9093,3@kafka-3:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-3:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-12}
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: ${KAFKA_REPLICATION_FACTOR:-3}
      KAFKA_CFG_MIN_INSYNC_REPLICAS: ${KAFKA_MIN_INSYNC_REPLICAS:-2}
      KAFKA_CFG_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_CFG_LOG_RETENTION_BYTES: ${KAFKA_LOG_RETENTION_BYTES:-10737418240}
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "secureops-onprem-cluster-001"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    volumes:
      - kafka_data_3:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      <<: *healthcheck-defaults
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    <<: *restart-policy
    environment:
      CLICKHOUSE_DB: ${CLICKHOUSE_DATABASE:-ccc}
      CLICKHOUSE_USER: ${CLICKHOUSE_USER:-default}
      CLICKHOUSE_PASSWORD: ${CLICKHOUSE_PASSWORD:-}
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: "1"
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    ports:
      - "${CLICKHOUSE_HTTP_PORT:-8123}:8123"
      - "${CLICKHOUSE_TCP_PORT:-9000}:9000"
    volumes:
      - clickhouse_data:/var/lib/clickhouse
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8123/ping"]
      <<: *healthcheck-defaults
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  minio:
    image: minio/minio:latest
    <<: *restart-policy
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      <<: *healthcheck-defaults
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    <<: *restart-policy
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/management/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - management-1
      - management-2
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  management-1:
    build:
      context: .
      dockerfile: deploy/management/Dockerfile
    <<: *restart-policy
    environment:
      <<: *management-env
      PORT: 5000
      INSTANCE_ID: management-1
    depends_on:
      management-db:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - management_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  management-2:
    build:
      context: .
      dockerfile: deploy/management/Dockerfile
    <<: *restart-policy
    environment:
      <<: *management-env
      PORT: 5000
      INSTANCE_ID: management-2
    depends_on:
      management-db:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - management_data_2:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  receiver:
    build:
      context: .
      dockerfile: deploy/receiver/Dockerfile
    <<: *restart-policy
    ports:
      - "${RECEIVER_PORT:-5001}:5000"
      - "514:514/udp"
      - "1514:1514"
      - "6514:6514"
    environment:
      <<: *data-plane-env
      PORT: 5000
      PLANE: receiver
      SERVICE_NAME: receiver
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  collector:
    build:
      context: .
      dockerfile: services/collector/Dockerfile
    <<: *restart-policy
    ports:
      - "${COLLECTOR_PORT:-5010}:5000"
    environment:
      <<: *data-plane-env
      PORT: 5000
      SERVICE_NAME: collector
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      POLLING_CONCURRENCY: ${POLLING_CONCURRENCY:-5}
      MAX_EVENTS_PER_CYCLE: ${MAX_EVENTS_PER_CYCLE:-10000}
      CIRCUIT_BREAKER_THRESHOLD: ${CIRCUIT_BREAKER_THRESHOLD:-5}
      CIRCUIT_BREAKER_COOLDOWN_MS: ${CIRCUIT_BREAKER_COOLDOWN_MS:-300000}
    depends_on:
      kafka-1:
        condition: service_healthy
      kafka-2:
        condition: service_healthy
      kafka-3:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  normalizer:
    build:
      context: .
      dockerfile: services/normalizer/Dockerfile
    <<: *restart-policy
    ports:
      - "${NORMALIZER_PORT:-5011}:5000"
    environment:
      <<: *data-plane-env
      PORT: 5000
      SERVICE_NAME: normalizer
      CONSUMER_CONCURRENCY: ${CONSUMER_CONCURRENCY:-10}
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
    depends_on:
      kafka-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  detection-engine:
    build:
      context: .
      dockerfile: services/detection-engine/Dockerfile
    <<: *restart-policy
    ports:
      - "${DETECTION_PORT:-5012}:5000"
    environment:
      <<: *data-plane-env
      PORT: 5000
      SERVICE_NAME: detection-engine
      SIGMA_RULES_PATH: /app/sigma-rules
      BATCH_SIZE: ${DETECTION_BATCH_SIZE:-100}
    depends_on:
      kafka-1:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 4G
        reservations:
          cpus: "0.5"
          memory: 1G

  enrichment:
    build:
      context: .
      dockerfile: services/enrichment/Dockerfile
    <<: *restart-policy
    ports:
      - "${ENRICHMENT_PORT:-5013}:5000"
    environment:
      <<: *data-plane-env
      PORT: 5000
      SERVICE_NAME: enrichment
      AI_PROVIDER: ${AI_PROVIDER:-openai}
      AI_API_KEY: ${AI_API_KEY:-}
      AI_BASE_URL: ${AI_BASE_URL:-}
      IOC_CACHE_TTL_MS: ${IOC_CACHE_TTL_MS:-3600000}
      CORRELATION_WINDOW_MS: ${CORRELATION_WINDOW_MS:-300000}
    depends_on:
      kafka-1:
        condition: service_healthy
      redis:
        condition: service_healthy
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  storage:
    build:
      context: .
      dockerfile: services/storage/Dockerfile
    <<: *restart-policy
    ports:
      - "${STORAGE_PORT:-5014}:5000"
    environment:
      <<: *data-plane-env
      PORT: 5000
      SERVICE_NAME: storage
      DATABASE_URL: ${DATAPLANE_DATABASE_URL:-postgresql://secureops:${DB_PASSWORD:-secureops_dev_password}@data-plane-db:5432/secureops_events}
      BATCH_SIZE: ${STORAGE_BATCH_SIZE:-500}
      BACKPRESSURE_LATENCY_MS: ${BACKPRESSURE_LATENCY_MS:-5000}
      HOT_RETENTION_DAYS: ${HOT_RETENTION_DAYS:-90}
      WARM_RETENTION_DAYS: ${WARM_RETENTION_DAYS:-365}
      COLD_RETENTION_DAYS: ${COLD_RETENTION_DAYS:-1095}
      CLOUD_STORAGE_PROVIDER: ${CLOUD_STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      data-plane-db:
        condition: service_healthy
      kafka-1:
        condition: service_healthy
    volumes:
      - dataplane_storage:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 1G

  data-plane:
    build:
      context: .
      dockerfile: deploy/data-plane/Dockerfile
    <<: *restart-policy
    ports:
      - "${DATA_PLANE_PORT:-5002}:5000"
    environment:
      <<: *data-plane-env
      PORT: 5000
      PLANE: data
      SERVICE_NAME: data-plane
      DATABASE_URL: ${DATAPLANE_DATABASE_URL:-postgresql://secureops:${DB_PASSWORD:-secureops_dev_password}@data-plane-db:5432/secureops_events}
      OBJECT_STORAGE_BUCKET: ${OBJECT_STORAGE_BUCKET:-secureops-events-local}
      CLOUD_STORAGE_PROVIDER: ${CLOUD_STORAGE_PROVIDER:-minio}
      MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
      MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}
    depends_on:
      data-plane-db:
        condition: service_healthy
