version: "3.9"

x-common-env: &common-env
  NODE_ENV: ${NODE_ENV:-production}
  KAFKA_BROKERS: ${KAFKA_BROKERS:-kafka-mgmt:9092}
  REDIS_URL: ${REDIS_URL:-redis://redis:6379}

x-management-env: &management-env
  <<: *common-env
  PLANE: management
  SERVICE_NAME: management
  DATABASE_URL: ${MANAGEMENT_DATABASE_URL:-postgresql://secureops:${DB_PASSWORD:-secureops_dev_password}@management-db:5432/secureops_management}
  SESSION_SECRET: ${SESSION_SECRET:-change-me-in-production}
  AI_PROVIDER: ${AI_PROVIDER:-openai}
  AI_MODEL: ${AI_MODEL:-}
  AI_API_KEY: ${AI_API_KEY:-${OPENAI_API_KEY:-}}
  AI_BASE_URL: ${AI_BASE_URL:-${OPENAI_BASE_URL:-}}
  SUPERADMIN_DEFAULT_PASSWORD: ${SUPERADMIN_DEFAULT_PASSWORD:-Admin@123}
  CLOUD_STORAGE_PROVIDER: ${CLOUD_STORAGE_PROVIDER:-minio}
  MINIO_ENDPOINT: ${MINIO_ENDPOINT:-http://minio:9000}
  MINIO_ACCESS_KEY: ${MINIO_ACCESS_KEY:-minioadmin}
  MINIO_SECRET_KEY: ${MINIO_SECRET_KEY:-minioadmin}

services:
  management-db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureops_management
      POSTGRES_USER: ${DB_USER:-secureops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureops_dev_password}
      POSTGRES_INITDB_ARGS: "--data-checksums"
    ports:
      - "${MGMT_DB_PORT:-5432}:5432"
    volumes:
      - management_pgdata:/var/lib/postgresql/data
    command: >
      postgres
        -c wal_level=replica
        -c max_wal_senders=5
        -c max_replication_slots=5
        -c hot_standby=on
        -c shared_buffers=256MB
        -c effective_cache_size=768MB
        -c work_mem=16MB
        -c maintenance_work_mem=128MB
        -c max_connections=200
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureops} -d secureops_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  management-db-replica:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: secureops_management
      POSTGRES_USER: ${DB_USER:-secureops}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-secureops_dev_password}
      PGDATA: /var/lib/postgresql/data
    volumes:
      - management_pgdata_replica:/var/lib/postgresql/data
    entrypoint: >
      bash -c "
        until pg_isready -h management-db -U ${DB_USER:-secureops}; do sleep 2; done;
        if [ ! -f /var/lib/postgresql/data/PG_VERSION ]; then
          pg_basebackup -h management-db -U ${DB_USER:-secureops} -D /var/lib/postgresql/data -Fp -Xs -R -P;
        fi;
        exec postgres -c hot_standby=on
      "
    depends_on:
      management-db:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-secureops} -d secureops_management"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      redis-server
        --maxmemory ${REDIS_MAXMEMORY:-256mb}
        --maxmemory-policy allkeys-lru
        --appendonly yes
        --appendfsync everysec
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 512M
        reservations:
          cpus: "0.25"
          memory: 128M

  redis-sentinel:
    image: redis:7-alpine
    restart: unless-stopped
    command: >
      sh -c "
        mkdir -p /etc/redis;
        echo 'port 26379' > /etc/redis/sentinel.conf;
        echo 'sentinel monitor secureops-master redis 6379 1' >> /etc/redis/sentinel.conf;
        echo 'sentinel down-after-milliseconds secureops-master 5000' >> /etc/redis/sentinel.conf;
        echo 'sentinel failover-timeout secureops-master 10000' >> /etc/redis/sentinel.conf;
        echo 'sentinel parallel-syncs secureops-master 1' >> /etc/redis/sentinel.conf;
        exec redis-sentinel /etc/redis/sentinel.conf
      "
    ports:
      - "${REDIS_SENTINEL_PORT:-26379}:26379"
    depends_on:
      redis:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "redis-cli", "-p", "26379", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  kafka-mgmt:
    image: bitnami/kafka:3.8
    environment:
      KAFKA_CFG_NODE_ID: "1"
      KAFKA_CFG_PROCESS_ROLES: broker,controller
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: "1@kafka-mgmt:9093"
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://kafka-mgmt:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_NUM_PARTITIONS: ${KAFKA_NUM_PARTITIONS:-6}
      KAFKA_CFG_DEFAULT_REPLICATION_FACTOR: 1
      KAFKA_CFG_LOG_RETENTION_HOURS: ${KAFKA_LOG_RETENTION_HOURS:-168}
      KAFKA_CFG_AUTO_CREATE_TOPICS_ENABLE: "true"
      KAFKA_KRAFT_CLUSTER_ID: "secureops-mgmt-cluster-001"
      ALLOW_PLAINTEXT_LISTENER: "yes"
    ports:
      - "${KAFKA_PORT:-9092}:9092"
    volumes:
      - kafka_mgmt_data:/bitnami/kafka
    healthcheck:
      test: ["CMD-SHELL", "kafka-broker-api-versions.sh --bootstrap-server localhost:9092"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 30s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 2G
        reservations:
          cpus: "0.25"
          memory: 512M

  minio:
    image: minio/minio:latest
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ACCESS_KEY:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_SECRET_KEY:-minioadmin}
    ports:
      - "${MINIO_API_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 10s
    deploy:
      resources:
        limits:
          cpus: "1.0"
          memory: 1G
        reservations:
          cpus: "0.25"
          memory: 256M

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      - ./deploy/management/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - management-1
      - management-2
    healthcheck:
      test: ["CMD-SHELL", "wget --no-verbose --tries=1 --spider http://localhost/healthz || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 256M
        reservations:
          cpus: "0.1"
          memory: 64M

  management-1:
    build:
      context: .
      dockerfile: deploy/management/Dockerfile
    restart: unless-stopped
    environment:
      <<: *management-env
      PORT: 5000
      INSTANCE_ID: management-1
    depends_on:
      management-db:
        condition: service_healthy
      kafka-mgmt:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - management_data:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

  management-2:
    build:
      context: .
      dockerfile: deploy/management/Dockerfile
    restart: unless-stopped
    environment:
      <<: *management-env
      PORT: 5000
      INSTANCE_ID: management-2
    depends_on:
      management-db:
        condition: service_healthy
      kafka-mgmt:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - management_data_2:/app/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
        reservations:
          cpus: "0.5"
          memory: 512M

volumes:
  management_pgdata:
    driver: local
  management_pgdata_replica:
    driver: local
  redis_data:
    driver: local
  kafka_mgmt_data:
    driver: local
  minio_data:
    driver: local
  management_data:
    driver: local
  management_data_2:
    driver: local
