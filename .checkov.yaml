##############################################################################
# .checkov.yaml — Checkov IaC security scanner configuration
#
# Used by Job D (iac-checkov) in .github/workflows/devsecops.yml.
# Checkov evaluates CloudFormation templates and Dockerfile against AWS
# security best-practice rules (CKV_AWS_*) and Dockerfile rules (CKV_DOCKER_*).
#
# Docs: https://www.checkov.io/2.Basics/CLI%20Command%20Reference.html
##############################################################################

# ── General settings ──────────────────────────────────────────────────────────
compact: true
quiet: false
download-external-modules: false

# ── Severity threshold ────────────────────────────────────────────────────────
# Soft-fail on MEDIUM; hard-fail on HIGH and CRITICAL.
# Adjust this line to tighten ("HIGH") or loosen ("CRITICAL") the gate.
soft-fail-on:
  - MEDIUM
  - LOW
  - INFO

# ── Skip rules with documented rationale ─────────────────────────────────────
# Each skip MUST have a comment explaining why it is accepted.
# Review this list quarterly and remove entries when fixes are in place.
skip-check:

  # CloudFormation — ALB / Networking
  - CKV_AWS_91
  # Rationale: ALB access logs → S3 is recommended but requires a dedicated
  # logging bucket. Deferred to post-launch ops hardening ticket.

  - CKV_AWS_150
  # Rationale: ALB deletion protection disabled in staging/dev environments
  # intentionally for rapid stack tear-down. Production stacks should enable
  # this manually after first validated deployment.

  # CloudFormation — ECS / ECR
  - CKV_AWS_336
  # Rationale: ECS task definitions use awslogs driver; Fluent Bit sidecar
  # shipping is tracked in the observability roadmap (separate ticket).

  - CKV_AWS_86
  # Rationale: ECR image scanning on push is configured at the registry level
  # outside CloudFormation; already enforced via Trivy in this pipeline.

  # CloudFormation — CloudWatch / Logging
  - CKV_AWS_111
  # Rationale: CloudWatch log group KMS encryption deferred; all log data is
  # non-PII operational telemetry. Will be added when KMS CMK is provisioned.

  - CKV_AWS_338
  # Rationale: CloudWatch log retention set to 90 days, which satisfies the
  # platform data-retention policy. CKV_AWS_338 requires 1 year; we maintain
  # a separate audit log in RDS with longer retention.

  # CloudFormation — RDS / Database
  - CKV_AWS_17
  # Rationale: RDS publicly accessible = false in all templates. This check
  # triggers on RDS Proxy resources which appear "public" due to subnet config.

  - CKV_AWS_23
  # Rationale: RDS parameter group in-transit encryption enforced at the
  # application layer (ssl=require in DATABASE_URL). CF-level parameter group
  # override tracked in hardening backlog.

  # Dockerfile
  - CKV_DOCKER_2
  # Rationale: HEALTHCHECK is defined in the Dockerfile using wget. This rule
  # sometimes false-positives on multi-stage builds where only the final stage
  # carries the HEALTHCHECK. Final stage has a proper HEALTHCHECK directive.

  - CKV_DOCKER_3
  # Rationale: USER appuser is set in the final runner stage. This rule
  # triggers on intermediate build stages (deps, builder) which intentionally
  # run as root to install OS packages and compile assets.
