name: Sync Sigma Rules from SigmaHQ

on:
  schedule:
    # Run every Sunday at 02:00 UTC
    - cron: '0 2 * * 0'
  workflow_dispatch:

jobs:
  sync:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0

      - name: Update SigmaHQ submodule
        run: |
          git submodule update --remote --depth=1 vendor/sigma-hq

      - name: Sync rules to sigma-rules/community/
        run: |
          chmod +x scripts/sync-sigma-rules.sh
          ./scripts/sync-sigma-rules.sh

      - name: Check for changes
        id: changes
        run: |
          if git diff --quiet --exit-code sigma-rules/community/; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
          else
            echo "changed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Create Pull Request
        if: steps.changes.outputs.changed == 'true'
        uses: peter-evans/create-pull-request@v6
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: chore/sync-sigma-rules
          title: 'chore: sync sigma rules from SigmaHQ'
          body: |
            Automated sync of Sigma rules from [SigmaHQ/sigma](https://github.com/SigmaHQ/sigma).

            - Submodule updated: `vendor/sigma-hq`
            - Community rules refreshed: `sigma-rules/community/`

            Please review and merge to deploy updated detection rules.
          commit-message: 'chore: sync sigma rules from SigmaHQ'
          delete-branch: true
