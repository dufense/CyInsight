apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: secureops-normalizer
  namespace: secureops
  labels:
    app: secureops
    component: normalizer
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: secureops-normalizer
  minReplicas: 2
  maxReplicas: 15
  metrics:
    - type: Resource
      resource:
        name: cpu
        target:
          type: Utilization
          averageUtilization: 70
    - type: Resource
      resource:
        name: memory
        target:
          type: Utilization
          averageUtilization: 80
  behavior:
    scaleUp:
      stabilizationWindowSeconds: 60
      policies:
        - type: Pods
          value: 3
          periodSeconds: 60
        - type: Percent
          value: 50
          periodSeconds: 60
      selectPolicy: Max
    scaleDown:
      stabilizationWindowSeconds: 300
      policies:
        - type: Pods
          value: 1
          periodSeconds: 120
      selectPolicy: Min
