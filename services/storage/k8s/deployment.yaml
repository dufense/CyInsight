apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-storage
  namespace: secureops
  labels:
    app: secureops
    component: storage
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureops
      component: storage
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 1
      maxSurge: 1
  template:
    metadata:
      labels:
        app: secureops
        component: storage
    spec:
      serviceAccountName: secureops-storage
      containers:
        - name: storage
          image: secureops/storage:latest
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
          env:
            - name: SERVICE
              value: "storage"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: database-url
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: secureops-storage-config
                  key: kafka-brokers
            - name: OPENSEARCH_URL
              valueFrom:
                configMapKeyRef:
                  name: secureops-storage-config
                  key: opensearch-url
            - name: OPENSEARCH_INDEX
              value: "secureops-events"
            - name: OPENSEARCH_USERNAME
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: opensearch-username
                  optional: true
            - name: OPENSEARCH_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: secureops-secrets
                  key: opensearch-password
                  optional: true
            - name: RETENTION_HOT_DAYS
              value: "90"
            - name: RETENTION_WARM_DAYS
              value: "365"
            - name: RETENTION_COLD_DAYS
              value: "2555"
            - name: WRITE_LATENCY_PAUSE_THRESHOLD
              value: "5000"
          resources:
            requests:
              cpu: "500m"
              memory: "1Gi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
