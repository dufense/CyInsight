apiVersion: apps/v1
kind: Deployment
metadata:
  name: secureops-collector
  namespace: secureops
  labels:
    app: secureops
    service: collector
    component: event-collection
spec:
  replicas: 2
  selector:
    matchLabels:
      app: secureops
      service: collector
  template:
    metadata:
      labels:
        app: secureops
        service: collector
        component: event-collection
    spec:
      serviceAccountName: secureops-collector
      containers:
        - name: collector
          image: secureops/collector:latest
          ports:
            - name: http
              containerPort: 5000
              protocol: TCP
            - name: syslog-udp
              containerPort: 514
              protocol: UDP
            - name: syslog-tcp
              containerPort: 1514
              protocol: TCP
          env:
            - name: SERVICE
              value: "collector"
            - name: NODE_ENV
              value: "production"
            - name: PORT
              value: "5000"
            - name: POLLING_CONCURRENCY
              value: "5"
            - name: MAX_EVENTS_PER_CYCLE
              value: "10000"
            - name: CIRCUIT_BREAKER_THRESHOLD
              value: "5"
            - name: CIRCUIT_BREAKER_COOLDOWN_MS
              value: "300000"
            - name: KAFKA_BROKERS
              valueFrom:
                configMapKeyRef:
                  name: secureops-collector-config
                  key: kafka-brokers
            - name: MANAGEMENT_PLANE_URL
              valueFrom:
                configMapKeyRef:
                  name: secureops-collector-config
                  key: management-plane-url
          resources:
            requests:
              cpu: "500m"
              memory: "512Mi"
            limits:
              cpu: "2000m"
              memory: "2Gi"
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 15
            periodSeconds: 30
            timeoutSeconds: 5
          readinessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 3
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: secureops-collector-config
  namespace: secureops
  labels:
    app: secureops
    service: collector
data:
  kafka-brokers: "kafka-0.kafka-headless.secureops.svc.cluster.local:9092,kafka-1.kafka-headless.secureops.svc.cluster.local:9092,kafka-2.kafka-headless.secureops.svc.cluster.local:9092"
  management-plane-url: "http://secureops-management.secureops.svc.cluster.local"
