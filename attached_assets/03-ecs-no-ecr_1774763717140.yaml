AWSTemplateFormatVersion: "2010-09-09"
Description: >
  GRC Shield — ECS Fargate Layer (No ECR - uses existing repo)
  Depends on: 01-vpc.yaml, 02-rds.yaml

Parameters:
  EnvironmentName:
    Type: String
    Default: grc-shield

  ImageTag:
    Type: String
    Default: latest

  TaskCpu:
    Type: Number
    Default: 512
    AllowedValues: [256, 512, 1024, 2048, 4096]

  TaskMemory:
    Type: Number
    Default: 1024

  DesiredCount:
    Type: Number
    Default: 1

  MinCapacity:
    Type: Number
    Default: 1

  MaxCapacity:
    Type: Number
    Default: 4

  CertificateArn:
    Type: String
    Default: ""

  SessionSecretArn:
    Type: String

  OpenAIKeyArn:
    Type: String
    Default: ""

  GithubTokenArn:
    Type: String
    Default: ""

Conditions:
  HasCertificate: !Not [!Equals [!Ref CertificateArn, ""]]
  HasOpenAIKey: !Not [!Equals [!Ref OpenAIKeyArn, ""]]
  HasGithubToken: !Not [!Equals [!Ref GithubTokenArn, ""]]

Resources:
  LogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/ecs/${EnvironmentName}/app"
      RetentionInDays: 30

  ECSCluster:
    Type: AWS::ECS::Cluster
    Properties:
      ClusterName: !Sub "${EnvironmentName}-cluster"
      ClusterSettings:
        - Name: containerInsights
          Value: enabled
      CapacityProviders:
        - FARGATE
        - FARGATE_SPOT
      DefaultCapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 4
          Base: 1
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 0

  ECSTaskExecutionRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-task-execution-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - arn:aws:iam::aws:policy/service-role/AmazonECSTaskExecutionRolePolicy
      Policies:
        - PolicyName: ReadSecrets
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                  - secretsmanager:DescribeSecret
                Resource:
                  - Fn::ImportValue: !Sub "${EnvironmentName}-DBSecretArn"
                  - !Ref SessionSecretArn
                  - !If [HasOpenAIKey, !Ref OpenAIKeyArn, !Ref AWS::NoValue]
                  - !If [HasGithubToken, !Ref GithubTokenArn, !Ref AWS::NoValue]

  ECSTaskRole:
    Type: AWS::IAM::Role
    Properties:
      RoleName: !Sub "${EnvironmentName}-task-role"
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal:
              Service: ecs-tasks.amazonaws.com
            Action: sts:AssumeRole
      Policies:
        - PolicyName: AppPermissions
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: "*"
              - Effect: Allow
                Action:
                  - secretsmanager:GetSecretValue
                Resource:
                  - Fn::ImportValue: !Sub "${EnvironmentName}-DBSecretArn"
                  - !Ref SessionSecretArn
              - Effect: Allow
                Action:
                  - ssm:GetParameter
                  - ssm:GetParameters
                  - ssm:GetParametersByPath
                Resource: !Sub "arn:aws:ssm:${AWS::Region}:${AWS::AccountId}:parameter/${EnvironmentName}/*"

  TaskDefinition:
    Type: AWS::ECS::TaskDefinition
    Properties:
      Family: !Sub "${EnvironmentName}-app"
      NetworkMode: awsvpc
      RequiresCompatibilities:
        - FARGATE
      Cpu: !Ref TaskCpu
      Memory: !Ref TaskMemory
      ExecutionRoleArn: !GetAtt ECSTaskExecutionRole.Arn
      TaskRoleArn: !GetAtt ECSTaskRole.Arn
      RuntimePlatform:
        CpuArchitecture: X86_64
        OperatingSystemFamily: LINUX
      ContainerDefinitions:
        - Name: app
          Image: !Sub "200810847769.dkr.ecr.${AWS::Region}.amazonaws.com/${EnvironmentName}/app:${ImageTag}"
          Essential: true
          PortMappings:
            - ContainerPort: 5000
              Protocol: tcp
          Environment:
            - Name: NODE_ENV
              Value: production
            - Name: PORT
              Value: "5000"
            - Name: SECURE_COOKIES
              Value: "true"
            - Name: UPLOAD_DIR
              Value: /app/uploads
            - Name: NODE_OPTIONS
              Value: "--max-old-space-size=512"
          Secrets:
            - Name: DATABASE_URL
              ValueFrom:
                Fn::Join:
                  - ""
                  - - Fn::ImportValue: !Sub "${EnvironmentName}-DBSecretArn"
                    - ":DATABASE_URL::"
            - Name: SESSION_SECRET
              ValueFrom: !Ref SessionSecretArn
            - !If
              - HasOpenAIKey
              - Name: OPENAI_API_KEY
                ValueFrom: !Ref OpenAIKeyArn
              - !Ref AWS::NoValue
            - !If
              - HasGithubToken
              - Name: GITHUB_TOKEN
                ValueFrom: !Ref GithubTokenArn
              - !Ref AWS::NoValue
          LogConfiguration:
            LogDriver: awslogs
            Options:
              awslogs-group: !Ref LogGroup
              awslogs-region: !Ref AWS::Region
              awslogs-stream-prefix: app
          HealthCheck:
            Command:
              - CMD-SHELL
              - node -e "const h=require('http');const r=h.get('http://localhost:5000/api/health',(res)=>{process.exit(res.statusCode===200?0:1)});r.on('error',()=>process.exit(1));r.setTimeout(5000,()=>{r.destroy();process.exit(1)})"
            Interval: 30
            Timeout: 10
            Retries: 3
            StartPeriod: 60
          ReadonlyRootFilesystem: false
          LinuxParameters:
            InitProcessEnabled: true
          MountPoints:
            - SourceVolume: tmp-storage
              ContainerPath: /tmp
            - SourceVolume: uploads-storage
              ContainerPath: /app/uploads
      Volumes:
        - Name: tmp-storage
        - Name: uploads-storage

  ALB:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Name: !Sub "${EnvironmentName}-alb"
      Scheme: internet-facing
      Type: application
      Subnets:
        - Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnet1Id"
        - Fn::ImportValue: !Sub "${EnvironmentName}-PublicSubnet2Id"
      SecurityGroups:
        - Fn::ImportValue: !Sub "${EnvironmentName}-ALBSecurityGroupId"
      LoadBalancerAttributes:
        - Key: idle_timeout.timeout_seconds
          Value: "120"
        - Key: deletion_protection.enabled
          Value: "false"

  ALBTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      Name: !Sub "${EnvironmentName}-tg"
      Port: 5000
      Protocol: HTTP
      TargetType: ip
      VpcId:
        Fn::ImportValue: !Sub "${EnvironmentName}-VpcId"
      HealthCheckPath: /api/health
      HealthCheckIntervalSeconds: 30
      HealthCheckTimeoutSeconds: 10
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 5
      Matcher:
        HttpCode: "200"
      TargetGroupAttributes:
        - Key: deregistration_delay.timeout_seconds
          Value: "30"
        - Key: stickiness.enabled
          Value: "true"
        - Key: stickiness.type
          Value: lb_cookie
        - Key: stickiness.lb_cookie.duration_seconds
          Value: "86400"

  ALBListenerHTTP:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 80
      Protocol: HTTP
      DefaultActions:
        - !If
          - HasCertificate
          - Type: redirect
            RedirectConfig:
              Protocol: HTTPS
              Port: "443"
              StatusCode: HTTP_301
          - Type: forward
            TargetGroupArn: !Ref ALBTargetGroup

  ALBListenerHTTPS:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Condition: HasCertificate
    Properties:
      LoadBalancerArn: !Ref ALB
      Port: 443
      Protocol: HTTPS
      SslPolicy: ELBSecurityPolicy-TLS13-1-2-2021-06
      Certificates:
        - CertificateArn: !Ref CertificateArn
      DefaultActions:
        - Type: forward
          TargetGroupArn: !Ref ALBTargetGroup

  ECSService:
    Type: AWS::ECS::Service
    DependsOn:
      - ALBListenerHTTP
    Properties:
      ServiceName: !Sub "${EnvironmentName}-app"
      Cluster: !Ref ECSCluster
      TaskDefinition: !Ref TaskDefinition
      DesiredCount: !Ref DesiredCount
      CapacityProviderStrategy:
        - CapacityProvider: FARGATE_SPOT
          Weight: 4
          Base: 1
        - CapacityProvider: FARGATE
          Weight: 1
          Base: 0
      PlatformVersion: LATEST
      NetworkConfiguration:
        AwsvpcConfiguration:
          Subnets:
            - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet1Id"
            - Fn::ImportValue: !Sub "${EnvironmentName}-PrivateSubnet2Id"
          SecurityGroups:
            - Fn::ImportValue: !Sub "${EnvironmentName}-AppSecurityGroupId"
          AssignPublicIp: DISABLED
      LoadBalancers:
        - ContainerName: app
          ContainerPort: 5000
          TargetGroupArn: !Ref ALBTargetGroup
      HealthCheckGracePeriodSeconds: 90
      DeploymentConfiguration:
        MinimumHealthyPercent: 0
        MaximumPercent: 100
        DeploymentCircuitBreaker:
          Enable: false
          Rollback: false
      EnableExecuteCommand: true

Outputs:
  ALBDNSName:
    Value: !GetAtt ALB.DNSName
    Description: ALB DNS name
    Export:
      Name: !Sub "${EnvironmentName}-ALBDNSName"

  ECSClusterName:
    Value: !Ref ECSCluster
    Export:
      Name: !Sub "${EnvironmentName}-ECSCluster"

  ECSServiceName:
    Value: !GetAtt ECSService.Name
    Export:
      Name: !Sub "${EnvironmentName}-ECSService"
