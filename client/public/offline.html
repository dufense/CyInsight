<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Offline – Cyber Command Center</title>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root { --bg: #0b1120; --card: #111827; --border: #1e2d45; --primary: #3b82f6; --text: #e2e8f0; --muted: #64748b; --accent: #06b6d4; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 1.5rem; }
    .card { background: var(--card); border: 1px solid var(--border); border-radius: 1rem; padding: 2.5rem; max-width: 420px; width: 100%; text-align: center; box-shadow: 0 0 40px rgba(0,0,0,0.5), 0 0 80px rgba(59,130,246,0.04); }
    .icon-wrap { width: 72px; height: 72px; border-radius: 50%; background: rgba(239,68,68,0.1); border: 1px solid rgba(239,68,68,0.25); display: flex; align-items: center; justify-content: center; margin: 0 auto 1.5rem; position: relative; }
    .icon-wrap svg { width: 34px; height: 34px; }
    .pulse-ring { position: absolute; inset: -8px; border-radius: 50%; border: 1px solid rgba(239,68,68,0.2); animation: pulse-ring 2s ease-out infinite; }
    @keyframes pulse-ring { 0% { opacity: 1; transform: scale(1); } 100% { opacity: 0; transform: scale(1.4); } }
    .brand { display: flex; align-items: center; justify-content: center; gap: 0.5rem; margin-bottom: 1.5rem; }
    .brand-icon { width: 28px; height: 28px; background: linear-gradient(135deg, #3b82f6, #1d4ed8); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
    .brand-icon svg { width: 16px; height: 16px; }
    .brand-name { font-size: 0.8rem; font-weight: 700; letter-spacing: 0.05em; color: var(--muted); text-transform: uppercase; }
    h1 { font-size: 1.375rem; font-weight: 700; margin-bottom: 0.75rem; color: var(--text); }
    p { font-size: 0.875rem; color: var(--muted); line-height: 1.6; margin-bottom: 1.5rem; }
    .status-row { display: flex; align-items: center; justify-content: center; gap: 0.5rem; font-size: 0.75rem; color: var(--muted); margin-bottom: 1.75rem; }
    .dot { width: 8px; height: 8px; border-radius: 50%; background: #ef4444; animation: blink 1.5s ease-in-out infinite; }
    @keyframes blink { 0%,100% { opacity: 1; } 50% { opacity: 0.3; } }
    .actions { display: flex; gap: 0.75rem; flex-wrap: wrap; justify-content: center; }
    button { padding: 0.6rem 1.25rem; border-radius: 0.5rem; font-size: 0.875rem; font-weight: 600; cursor: pointer; transition: all 0.15s; border: none; outline: none; }
    .btn-primary { background: var(--primary); color: #fff; }
    .btn-primary:hover { background: #2563eb; }
    .btn-outline { background: transparent; color: var(--text); border: 1px solid var(--border); }
    .btn-outline:hover { background: rgba(255,255,255,0.05); }
    .footer { margin-top: 2rem; font-size: 0.7rem; color: var(--muted); opacity: 0.6; }
    #reconnect-msg { display: none; font-size: 0.8rem; color: #22c55e; margin-top: 0.75rem; animation: fadeIn 0.3s; }
    @keyframes fadeIn { from { opacity: 0; transform: translateY(-4px); } to { opacity: 1; transform: translateY(0); } }
  </style>
</head>
<body>
  <div class="card">
    <div class="brand">
      <div class="brand-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
        </svg>
      </div>
      <span class="brand-name">Cyber Command Center</span>
    </div>

    <div class="icon-wrap">
      <div class="pulse-ring"></div>
      <svg viewBox="0 0 24 24" fill="none" stroke="#ef4444" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round">
        <line x1="1" y1="1" x2="23" y2="23"/>
        <path d="M16.72 11.06A10.94 10.94 0 0 1 19 12.55"/>
        <path d="M5 12.55a10.94 10.94 0 0 1 5.17-2.39"/>
        <path d="M10.71 5.05A16 16 0 0 1 22.56 9"/>
        <path d="M1.42 9a15.91 15.91 0 0 1 4.7-2.88"/>
        <path d="M8.53 16.11a6 6 0 0 1 6.95 0"/>
        <line x1="12" y1="20" x2="12.01" y2="20"/>
      </svg>
    </div>

    <h1>No Connection</h1>
    <p>The Cyber Command Center is unavailable offline. Your cached data may still be viewable — try going back to the app.</p>

    <div class="status-row">
      <div class="dot" id="status-dot"></div>
      <span id="status-text">Waiting for network…</span>
    </div>

    <div class="actions">
      <button class="btn-primary" onclick="tryReload()">Try Again</button>
      <button class="btn-outline" onclick="goBack()">Go Back</button>
    </div>

    <div id="reconnect-msg">Connection restored — reloading…</div>
  </div>

  <p class="footer">Cached app version available. Some data may be stale.</p>

  <script>
    function tryReload() { window.location.href = '/'; }
    function goBack() { if (history.length > 1) { history.back(); } else { window.location.href = '/'; } }

    window.addEventListener('online', () => {
      document.getElementById('status-dot').style.background = '#22c55e';
      document.getElementById('status-text').textContent = 'Connection restored!';
      document.getElementById('reconnect-msg').style.display = 'block';
      setTimeout(() => { window.location.href = '/'; }, 1500);
    });
  </script>
</body>
</html>
