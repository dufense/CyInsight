title: Brute Force Authentication Attempt
id: sigma-auth-001
status: stable
level: high
description: Detects multiple failed authentication attempts from the same source, indicating a potential brute force attack.
author: SecureOps
date: 2024/01/01
logsource:
  category: authentication
  product: any
detection:
  selection:
    eventType: identity
  keywords:
    - brute force
    - failed login
    - authentication failure
    - login failed
    - invalid credentials
    - account lockout
    - failed password
  condition: selection AND keywords
falsepositives:
  - Legitimate users forgetting passwords
  - Password rotation policies
tags:
  - attack.credential_access
  - attack.t1110
mitre:
  tactic: Credential Access
  technique: T1110
  technique_name: Brute Force
